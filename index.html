<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kaixo · Euskera</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#D6283A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kaixo">
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#FFF8F2;color:#D6283A;font:800 30px Georgia,serif;letter-spacing:1px}@media (prefers-color-scheme:dark){body{background:#14181f}}</style>
</head><body>KAIXO
<script>
/* Carrega l'app original (kaixo.html) i hi afegeix kx-extra.js. Si falla, obre l'app original tal com és. */
(async function () {
  try {
    const r = await fetch("kaixo.html");
    if (!r.ok) throw new Error("kaixo.html");
    let h = await r.text();
    if (h.indexOf("kx-extra.js") < 0) {
      const tag = '<script src="kx-extra.js"><\/script>', i = h.toLowerCase().lastIndexOf("</body>");
      h = i >= 0 ? h.slice(0, i) + tag + h.slice(i) : h + tag;
    }
    document.open(); document.write(h); document.close();
  } catch (e) { location.replace("kaixo.html"); }
})();
</script>
</body></html>
