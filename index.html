    const q=encodeURIComponent('incategory:"Lingua Libre pronunciation-eus" "'+key.replace(/"/g,'')+'"');
    const api="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch="+q;
    const r=await fetch(api,{cache:"force-cache"});
    if(!r.ok)return "";
    const j=await r.json(),pages=Object.values(j.query?.pages||{});
    const p=pages.find(x=>/\.(?:wav|ogg|oga|mp3|m4a)$/i.test(x.title||""));
    if(!p)return "";
    const title=(p.title||"").replace(/^File:/,"");
    const url=commonsRedirect(title);
    audioMap[key]=url;saveAudioMap();
    return url;
  }catch(e){return ""}
}
const playUrl=(url)=>{
  return new Promise(resolve=>{
    try{
      stopAudio();
      const a=new Audio();
      currentAudio=a;
      let settled=false;
      const finish=v=>{if(settled)return;settled=true;resolve(v)};
      a.oncanplay=()=>{a.play().then(()=>finish(true)).catch(()=>finish(false))};
      a.onerror=()=>finish(false);
      a.src=url;
      a.load();
    }catch(e){resolve(false)}
  });
};
const canSay=s=>!!MEDIA.a[slug(s)]||!!AUDIO_BASE||hasEU()||!!audioMap[audioName(s)]||!!s;
const say=async s=>{
  if(!s)return;
  const local=MEDIA.a[slug(s)];
  if(local){if(await playUrl(local))return}
  if(AUDIO_BASE){
    if(await playUrl(AUDIO_BASE+slug(s)+".mp3"))return;
  }
  const cached=audioMap[audioName(s)];
  if(cached&&await playUrl(cached))return;
  for(const u of directCandidates(s)){
    if(await playUrl(u)){audioMap[audioName(s)]=u;saveAudioMap();return}
  }
  const found=await commonsSearchAudio(s);
  if(found&&await playUrl(found))return;
  if(hasEU()&&tts(s))return;
  try{alert("🔊 No he trobat una pronunciació d'aquest mot/frase encara.")}catch(e){}
};

s:[[["Algú parla massa de pressa. Què li demanes?","Alguien habla demasiado rápido. ¿Qué le pides?","Someone speaks too fast. What do you ask?","Quelqu'un parle trop vite. Que lui demandes-tu ?"],3,[5,9]],[["Vols que t'ho tornin a dir. Què dius?","Quieres que te lo repitan. ¿Qué dices?","You want them to say it again. What do you say?","Tu veux qu'on te le répète. Que dis-tu ?"],2,[8,5]],[["Vols que et parlin en euskera i no en castellà. Què dius?","Quieres que te hablen en euskera y no en castellano. ¿Qué dices?","You want them to speak Basque, not Spanish. What do you say?","Tu veux qu'on te parle en basque et non en espagnol. Que dis-tu ?"],8,[2,9]]]},

s:[[["Coneixes algú al matí. Quina salutació fas servir?","Conoces a alguien por la mañana. ¿Qué saludo usas?","You meet someone in the morning. Which greeting do you use?","Tu rencontres quelqu'un le matin. Quelle salutation utilises-tu ?"],1,[11,4]],[["Vols saber com es diu algú. Què preguntes?","Quieres saber cómo se llama alguien. ¿Qué preguntas?","You want to know someone's name. What do you ask?","Tu veux savoir comment quelqu'un s'appelle. Que demandes-tu ?"],5,[7,2]],[["Algú et diu «Pozten naiz zu ezagutzeaz!». Què respons?","Alguien te dice «Pozten naiz zu ezagutzeaz!». ¿Qué respondes?","Someone says “Pozten naiz zu ezagutzeaz!” to you. What do you answer?","Quelqu'un te dit « Pozten naiz zu ezagutzeaz ! ». Que réponds-tu ?"],10,[5,11]]]},

{t:["Repte: nire bizimodua","Reto: mi forma de vida","Challenge: my lifestyle","Défi : mon mode de vie"],mis:["Missió: explicar com és el teu dia a dia i què fas","Misión: explicar cómo es tu día a día y qué haces","Mission: describe your daily life and what you do","Mission : décrire ta vie quotidienne et ce que tu fais"],v:[["ondo nabil",["em va bé","me va bien","I'm doing well","ça va bien"]],["lanpetuta nabil",["vaig molt ocupat","ando muy ocupado","I'm very busy","je suis très occupé"]],["zer egin duzu azkenaldian?",["què has fet últimament?","¿qué has hecho últimamente?","what have you been doing lately?","qu'as-tu fait dernièrement ?"]],["irakaslea",["professor","profesor","teacher","professeur"]],["medikua",["metge","médico","doctor","médecin"]],["gitarra jotzen dut",["toco la guitarra","toco la guitarra","I play the guitar","je joue de la guitare"]],["zinemara joaten naiz",["vaig al cinema","voy al cine","I go to the cinema","je vais au cinéma"]],["beti",["sempre","siempre","always","toujours"]],["egunero",["cada dia","cada día","every day","chaque jour"]],["astean behin",["un cop per setmana","una vez por semana","once a week","une fois par semaine"]],["atzo",["ahir","ayer","yesterday","hier"]],["bihar",["demà","mañana","tomorrow","demain"]]],c:[{"b":["Lan asko duzu. Zer esaten duzu?",["Tens molta feina. Què dius?","Tienes mucho trabajo. ¿Qué dices?","You have a lot of work. What do you say?","Tu as beaucoup de travail. Que dis-tu ?"]],"o":[1,7,10]},{"b":["Zer lanbide duzu? Gaixoak sendatzen dituzu.",["Quina professió tens? Cures malalts.","¿Qué profesión tienes? Curas a enfermos.","What's your job? You cure the sick.","Quel est ton métier ? Tu soignes les malades."]],"o":[4,3,6]},{"b":["Zinemara joaten zara, baina astean behin bakarrik. Zer esaten duzu?",["Vas al cinema, però només un cop per setmana. Què dius?","Vas al cine, pero solo una vez por semana. ¿Qué dices?","You go to the cinema, but only once a week. What do you say?","Tu vas au cinéma, mais seulement une fois par semaine. Que dis-tu ?"]],"o":[9,7,8]}],s:[[["Vols dir «cada dia». Què dius?","Quieres decir «cada día». ¿Qué dices?","You want to say “every day”. What do you say?","Tu veux dire « chaque jour ». Que dis-tu ?"],8,[7,9]],[["Vols dir «ahir». Què dius?","Quieres decir «ayer». ¿Qué dices?","You want to say “yesterday”. What do you say?","Tu veux dire « hier ». Que dis-tu ?"],10,[11,3]],[["Vols dir «toco la guitarra». Què dius?","Quieres decir «toco la guitarra». ¿Qué dices?","You want to say “I play the guitar”. What do you say?","Tu veux dire « je joue de la guitare ». Que dis-tu ?"],5,[6,3]]]},
{t:["Atzo","Ayer","Yesterday","Hier"],mis:["Missió: explicar què vas fer ahir","Misión: contar qué hiciste ayer","Mission: say what you did yesterday","Mission : raconter ce que tu as fait hier"],v:[["atzo etxean egon nintzen",["ahir vaig ser a casa","ayer estuve en casa","yesterday I was at home","hier j'étais à la maison"]],["goizean jaiki nintzen",["al matí em vaig llevar","por la mañana me levanté","I got up in the morning","ce matin-là je me suis levé"]],["gosaldu nuen",["vaig esmorzar","desayuné","I had breakfast","j'ai pris le petit-déjeuner"]],["lanera joan nintzen",["vaig anar a la feina","fui al trabajo","I went to work","je suis allé au travail"]],["bazkaldu nuen",["vaig dinar","comí","I had lunch","j'ai déjeuné"]],["lagun batekin hitz egin nuen",["vaig parlar amb un amic","hablé con un amigo","I talked to a friend","j'ai parlé avec un ami"]],["liburu bat irakurri nuen",["vaig llegir un llibre","leí un libro","I read a book","j'ai lu un livre"]],["telebista ikusi nuen",["vaig mirar la televisió","vi la televisión","I watched TV","j'ai regardé la télé"]],["afaldu nuen",["vaig sopar","cené","I had dinner","j'ai dîné"]],["berandu oheratu nintzen",["em vaig ficar al llit tard","me acosté tarde","I went to bed late","je me suis couché tard"]],["ondo lo egin nuen",["vaig dormir bé","dormí bien","I slept well","j'ai bien dormi"]],["ez nintzen lanera joan",["no vaig anar a la feina","no fui al trabajo","I didn't go to work","je ne suis pas allé au travail"]]],c:[{"b":["Atzo oso goiz esnatu zinen eta ohetik atera zinen. Zer esaten duzu?",["Ahir et vas despertar molt d'hora i vas sortir del llit. Què dius?","Ayer te despertaste muy temprano y saliste de la cama. ¿Qué dices?","Yesterday you woke up very early and got out of bed. What do you say?","Hier tu t'es réveillé très tôt et tu t'es levé. Que dis-tu ?"]],"o":[1,9,10]},{"b":["Atzo lagun batekin egon zinen eta berarekin hizketan aritu zinen. Zer esaten duzu?",["Ahir vas estar amb un amic i hi vas parlar. Què dius?","Ayer estuviste con un amigo y hablaste con él. ¿Qué dices?","Yesterday you were with a friend and talked to him. What do you say?","Hier tu étais avec un ami et tu as parlé avec lui. Que dis-tu ?"]],"o":[5,6,7]},{"b":["Atzo gauean oso berandu ohera joan zinen. Zer esaten duzu?",["Ahir a la nit vas anar al llit molt tard. Què dius?","Anoche te fuiste a la cama muy tarde. ¿Qué dices?","Last night you went to bed very late. What do you say?","Hier soir tu t'es couché très tard. Que dis-tu ?"]],"o":[9,10,8]}],s:[[["Vols dir «vaig esmorzar». Què dius?","Quieres decir «desayuné». ¿Qué dices?","You want to say “I had breakfast”. What do you say?","Tu veux dire « j'ai pris le petit-déjeuner ». Que dis-tu ?"],2,[8,4]],[["Vols dir «vaig anar a la feina». Què dius?","Quieres decir «fui al trabajo». ¿Qué dices?","You want to say “I went to work”. What do you say?","Tu veux dire « je suis allé au travail ». Que dis-tu ?"],3,[0,11]],[["Vols dir «vaig llegir un llibre». Què dius?","Quieres decir «leí un libro». ¿Qué dices?","You want to say “I read a book”. What do you say?","Tu veux dire « j'ai lu un livre ». Que dis-tu ?"],6,[7,5]]]},
{t:["Joan den asteburua","El fin de semana pasado","Last weekend","Le week-end dernier"],mis:["Missió: explicar com va anar el cap de setmana","Misión: contar cómo fue el fin de semana","Mission: tell how your weekend went","Mission : raconter comment s'est passé le week-end"],v:[["asteburuan",["el cap de setmana","el fin de semana","at the weekend","le week-end"]],["larunbatean",["dissabte","el sábado","on Saturday","samedi"]],["igandean",["diumenge","el domingo","on Sunday","dimanche"]],["txangoa egin nuen",["vaig fer una excursió","hice una excursión","I went on a trip","j'ai fait une excursion"]],["lagunekin afaldu nuen",["vaig sopar amb amics","cené con amigos","I had dinner with friends","j'ai dîné avec des amis"]],["zinemara joan ginen",["vam anar al cinema","fuimos al cine","we went to the cinema","nous sommes allés au cinéma"]],["mendira joan nintzen",["vaig anar a la muntanya","fui a la montaña","I went to the mountains","je suis allé à la montagne"]],["oso ondo pasatu genuen",["ens ho vam passar molt bé","lo pasamos muy bien","we had a great time","nous nous sommes bien amusés"]],["etxean geratu nintzen",["em vaig quedar a casa","me quedé en casa","I stayed at home","je suis resté à la maison"]],["familiarekin bazkaldu nuen",["vaig dinar amb la família","comí con la familia","I had lunch with my family","j'ai déjeuné avec ma famille"]],["ez nuen ezer egin",["no vaig fer res","no hice nada","I did nothing","je n'ai rien fait"]],["nekatuta nengoen",["estava cansat","estaba cansado","I was tired","j'étais fatigué"]]],c:[{"b":["Larunbatean mendira joan zinen. Zer esaten duzu?",["Dissabte vas anar a la muntanya. Què dius?","El sábado fuiste a la montaña. ¿Qué dices?","On Saturday you went to the mountains. What do you say?","Samedi tu es allé à la montagne. Que dis-tu ?"]],"o":[6,5,8]},{"b":["Igandean etxean egon zinen eta atseden hartu zenuen. Zer esaten duzu?",["Diumenge vas ser a casa i vas descansar. Què dius?","El domingo estuviste en casa y descansaste. ¿Qué dices?","On Sunday you stayed in and rested. What do you say?","Dimanche tu es resté à la maison et tu t'es reposé. Que dis-tu ?"]],"o":[8,3,5]},{"b":["Zure lagunek galdetzen dute nola izan zen asteburua. Oso polita izan zen. Zer esaten duzu?",["Els teus amics et pregunten com va anar el cap de setmana. Va ser molt bonic. Què dius?","Tus amigos te preguntan cómo fue el fin de semana. Fue muy bonito. ¿Qué dices?","Your friends ask how the weekend was. It was great. What do you say?","Tes amis te demandent comment s'est passé le week-end. C'était très bien. Que dis-tu ?"]],"o":[7,10,11]}],s:[[["Vols dir «no vaig fer res». Què dius?","Quieres decir «no hice nada». ¿Qué dices?","You want to say “I did nothing”. What do you say?","Tu veux dire « je n'ai rien fait ». Que dis-tu ?"],10,[11,8]],[["Vols dir «vaig fer una excursió». Què dius?","Quieres decir «hice una excursión». ¿Qué dices?","You want to say “I went on a trip”. What do you say?","Tu veux dire « j'ai fait une excursion ». Que dis-tu ?"],3,[4,6]],[["Vols dir «estava cansat». Què dius?","Quieres decir «estaba cansado». ¿Qué dices?","You want to say “I was tired”. What do you say?","Tu veux dire « j'étais fatigué ». Que dis-tu ?"],11,[7,10]]]},
{t:["Oporrak","Vacaciones","Holidays","Vacances"],mis:["Missió: explicar com van ser les vacances","Misión: contar cómo fueron las vacaciones","Mission: tell how your holidays were","Mission : raconter comment étaient les vacances"],v:[["oporretan",["de vacances","de vacaciones","on holiday","en vacances"]],["hondartza",["platja","playa","beach","plage"]],["hotela",["hotel","hotel","hotel","hôtel"]],["maleta",["maleta","maleta","suitcase","valise"]],["pasaportea",["passaport","pasaporte","passport","passeport"]],["billetea",["bitllet","billete","ticket","billet"]],["oporretara joan nintzen",["vaig anar de vacances","fui de vacaciones","I went on holiday","je suis parti en vacances"]],["hotel batean geratu ginen",["ens vam allotjar en un hotel","nos alojamos en un hotel","we stayed in a hotel","nous avons logé dans un hôtel"]],["hiri berri bat ezagutu nuen",["vaig conèixer una ciutat nova","conocí una ciudad nueva","I got to know a new city","j'ai découvert une nouvelle ville"]],["argazki asko atera nituen",["vaig fer moltes fotos","hice muchas fotos","I took lots of photos","j'ai pris beaucoup de photos"]],["eguraldi ona egin zuen",["va fer bon temps","hizo buen tiempo","the weather was nice","il a fait beau"]],["euria egin zuen",["va ploure","llovió","it rained","il a plu"]]],c:[{"b":["Atzerrira joateko nortasun agiri berezia behar duzu. Zer da?",["Per anar a l'estranger necessites un document especial. Què és?","Para ir al extranjero necesitas un documento especial. ¿Qué es?","To travel abroad you need a special document. What is it?","Pour aller à l'étranger il faut un document spécial. Qu'est-ce que c'est ?"]],"o":[4,3,5]},{"b":["Eguzkitan eta itsasoan egoteko non zaude?",["On ets per estar al sol i al mar?","¿Dónde estás para estar al sol y en el mar?","Where are you to enjoy sun and sea?","Où es-tu pour profiter du soleil et de la mer ?"]],"o":[1,2,3]},{"b":["Bidaia batean gauean lo egiten duzu. Non?",["En un viatge dorms de nit. On?","En un viaje duermes por la noche. ¿Dónde?","On a trip you sleep at night. Where?","En voyage tu dors la nuit. Où ?"]],"o":[2,1,3]}],s:[[["Vols dir «va fer bon temps». Què dius?","Quieres decir «hizo buen tiempo». ¿Qué dices?","You want to say “the weather was nice”. What do you say?","Tu veux dire « il a fait beau ». Que dis-tu ?"],10,[11,9]],[["Vols dir «ens vam allotjar en un hotel». Què dius?","Quieres decir «nos alojamos en un hotel». ¿Qué dices?","You want to say “we stayed in a hotel”. What do you say?","Tu veux dire « nous avons logé dans un hôtel ». Que dis-tu ?"],7,[6,8]],[["Vols dir «maleta». Què dius?","Quieres decir «maleta». ¿Qué dices?","You want to say “suitcase”. What do you say?","Tu veux dire « valise ». Que dis-tu ?"],3,[0,5]]]},
{t:["Zer egin duzu?","¿Qué has hecho?","What have you done?","Qu'as-tu fait ?"],mis:["Missió: parlar del que ja has fet o no avui","Misión: hablar de lo que ya has hecho o no hoy","Mission: talk about what you have or haven't done today","Mission : parler de ce que tu as déjà fait ou pas aujourd'hui"],v:[["zer egin duzu gaur?",["què has fet avui?","¿qué has hecho hoy?","what have you done today?","qu'as-tu fait aujourd'hui ?"]],["gaur goiz jaiki naiz",["avui m'he llevat d'hora","hoy me he levantado temprano","I got up early today","je me suis levé tôt aujourd'hui"]],["jada gosaldu dut",["ja he esmorzat","ya he desayunado","I've already had breakfast","j'ai déjà pris le petit-déjeuner"]],["oraindik ez dut bazkaldu",["encara no he dinat","todavía no he comido","I haven't had lunch yet","je n'ai pas encore déjeuné"]],["dagoeneko bukatu dut",["ja he acabat","ya he terminado","I've finished already","j'ai déjà fini"]],["orain bertan iritsi naiz",["acabo d'arribar","acabo de llegar","I've just arrived","je viens d'arriver"]],["inoiz ez naiz Parisen egon",["mai he estat a París","nunca he estado en París","I've never been to Paris","je ne suis jamais allé à Paris"]],["inoiz ikusi duzu hori?",["ho has vist mai?","¿has visto eso alguna vez?","have you ever seen that?","as-tu déjà vu ça ?"]],["gaur ez dut lanik egin",["avui no he treballat","hoy no he trabajado","I haven't worked today","je n'ai pas travaillé aujourd'hui"]],["asko ikasi dut",["he après molt","he aprendido mucho","I've learned a lot","j'ai beaucoup appris"]],["ez dut ulertu",["no ho he entès","no lo he entendido","I haven't understood","je n'ai pas compris"]],["zer gertatu da?",["què ha passat?","¿qué ha pasado?","what has happened?","que s'est-il passé ?"]]],c:[{"b":["Orain iritsi zara etxera. Zer esaten duzu?",["Acabes d'arribar a casa. Què dius?","Acabas de llegar a casa. ¿Qué dices?","You've just got home. What do you say?","Tu viens d'arriver à la maison. Que dis-tu ?"]],"o":[5,2,4]},{"b":["Ez duzu oraindik jan. Zer esaten duzu?",["Encara no has menjat. Què dius?","Todavía no has comido. ¿Qué dices?","You haven't eaten yet. What do you say?","Tu n'as pas encore mangé. Que dis-tu ?"]],"o":[3,2,4]},{"b":["Zerbait arraroa gertatu da. Zer galdetzen duzu?",["Ha passat una cosa estranya. Què preguntes?","Ha pasado algo raro. ¿Qué preguntas?","Something strange has happened. What do you ask?","Il s'est passé quelque chose d'étrange. Que demandes-tu ?"]],"o":[11,0,7]}],s:[[["Vols dir «mai he estat a París». Què dius?","Quieres decir «nunca he estado en París». ¿Qué dices?","You want to say “I've never been to Paris”. What do you say?","Tu veux dire « je ne suis jamais allé à Paris ». Que dis-tu ?"],6,[7,8]],[["Vols dir «he après molt». Què dius?","Quieres decir «he aprendido mucho». ¿Qué dices?","You want to say “I've learned a lot”. What do you say?","Tu veux dire « j'ai beaucoup appris ». Que dis-tu ?"],9,[10,1]],[["Vols dir «què has fet avui?». Què dius?","Quieres decir «¿qué has hecho hoy?». ¿Qué dices?","You want to say “what have you done today?”. What do you say?","Tu veux dire « qu'as-tu fait aujourd'hui ? ». Que dis-tu ?"],0,[11,1]]]},
{t:["Gertatutakoa kontatu","Contar lo ocurrido","Telling what happened","Raconter ce qui s'est passé"],mis:["Missió: explicar una història en ordre: primer, després, finalment","Misión: contar una historia en orden: primero, luego, finalmente","Mission: tell a story in order: first, then, finally","Mission : raconter une histoire dans l'ordre : d'abord, ensuite, enfin"],v:[["lehenik",["primer","primero","first","d'abord"]],["gero",["després","luego","then","ensuite"]],["ondoren",["a continuació","a continuación","after that","après cela"]],["orduan",["llavors","entonces","then, at that moment","alors"]],["azkenik",["finalment","finalmente","finally","enfin"]],["bat-batean",["de sobte","de repente","suddenly","soudain"]],["handik gutxira",["poc després","poco después","shortly after","peu après"]],["zerbait gertatu zen",["va passar una cosa","pasó algo","something happened","quelque chose s'est passé"]],["pozik jarri nintzen",["em vaig alegrar","me puse contento","I was happy","je me suis réjoui"]],["beldurtu nintzen",["em vaig espantar","me asusté","I got scared","j'ai eu peur"]],["denak barre egin genuen",["tots vam riure","todos nos reímos","we all laughed","nous avons tous ri"]],["horrela bukatu zen",["així va acabar","así terminó","that's how it ended","c'est ainsi que cela s'est terminé"]]],c:[{"b":["Istorio bat hasten duzu. Zer esaten duzu lehenengo?",["Comences una història. Què dius primer?","Empiezas una historia. ¿Qué dices primero?","You begin a story. What do you say first?","Tu commences une histoire. Que dis-tu d'abord ?"]],"o":[0,4,1]},{"b":["Istorioa bukatzen ari zara. Zer esaten duzu?",["Estàs acabant la història. Què dius?","Estás terminando la historia. ¿Qué dices?","You're finishing the story. What do you say?","Tu termines l'histoire. Que dis-tu ?"]],"o":[4,0,5]},{"b":["Ustekabean zerbait gertatu zen. Zer esaten duzu?",["Va passar una cosa inesperadament. Què dius?","Algo pasó inesperadamente. ¿Qué dices?","Something unexpected happened. What do you say?","Quelque chose d'inattendu s'est passé. Que dis-tu ?"]],"o":[5,0,1]}],s:[[["Vols dir «després». Què dius?","Quieres decir «luego». ¿Qué dices?","You want to say “then”. What do you say?","Tu veux dire « ensuite ». Que dis-tu ?"],1,[0,4]],[["Vols dir «va passar una cosa». Què dius?","Quieres decir «pasó algo». ¿Qué dices?","You want to say “something happened”. What do you say?","Tu veux dire « quelque chose s'est passé ». Que dis-tu ?"],7,[8,9]],[["Vols dir «així va acabar». Què dius?","Quieres decir «así terminó». ¿Qué dices?","You want to say “that's how it ended”. What do you say?","Tu veux dire « c'est ainsi que cela s'est terminé ». Que dis-tu ?"],11,[10,3]]]},
{t:["Filmak eta liburuak","Películas y libros","Films and books","Films et livres"],mis:["Missió: parlar d'una pel·lícula o d'un llibre que has vist o llegit","Misión: hablar de una película o un libro que has visto o leído","Mission: talk about a film or book you've seen or read","Mission : parler d'un film ou d'un livre que tu as vu ou lu"],v:[["filma",["pel·lícula","película","film","film"]],["liburua",["llibre","libro","book","livre"]],["antzerkia",["teatre","teatro","theatre","théâtre"]],["kontzertua",["concert","concierto","concert","concert"]],["ipuina",["conte","cuento","story","conte"]],["nobela",["novel·la","novela","novel","roman"]],["aktorea",["actor","actor","actor","acteur"]],["idazlea",["escriptor","escritor","writer","écrivain"]],["filma ikusi dut",["he vist una pel·lícula","he visto una película","I've seen a film","j'ai vu un film"]],["liburu bat irakurri dut",["he llegit un llibre","he leído un libro","I've read a book","j'ai lu un livre"]],["asko gustatu zait",["m'ha agradat molt","me ha gustado mucho","I liked it a lot","ça m'a beaucoup plu"]],["ez zait gustatu",["no m'ha agradat","no me ha gustado","I didn't like it","ça ne m'a pas plu"]]],c:[{"b":["Liburu bat idatzi du. Nor da?",["Ha escrit un llibre. Qui és?","Ha escrito un libro. ¿Quién es?","He has written a book. Who is he?","Il a écrit un livre. Qui est-ce ?"]],"o":[7,6,1]},{"b":["Gauean zinemara joan zara eta pelikula ona izan da. Zer esaten duzu?",["Has anat al cinema a la nit i la pel·lícula era bona. Què dius?","Has ido al cine por la noche y la película era buena. ¿Qué dices?","You went to the cinema at night and the film was good. What do you say?","Tu es allé au cinéma le soir et le film était bon. Que dis-tu ?"]],"o":[10,11,9]},{"b":["Antzokira joan zara. Zer ikusi duzu?",["Has anat al teatre. Què has vist?","Has ido al teatro. ¿Qué has visto?","You went to the theatre. What did you see?","Tu es allé au théâtre. Qu'as-tu vu ?"]],"o":[2,3,1]}],s:[[["Vols dir «pel·lícula». Què dius?","Quieres decir «película». ¿Qué dices?","You want to say “film”. What do you say?","Tu veux dire « film ». Que dis-tu ?"],0,[1,4]],[["Vols dir «escriptor». Què dius?","Quieres decir «escritor». ¿Qué dices?","You want to say “writer”. What do you say?","Tu veux dire « écrivain ». Que dis-tu ?"],7,[6,5]],[["Vols dir «concert». Què dius?","Quieres decir «concierto». ¿Qué dices?","You want to say “concert”. What do you say?","Tu veux dire « concert ». Que dis-tu ?"],3,[2,0]]]},
{t:["Haurtzaroa","La infancia","Childhood","L'enfance"],mis:["Missió: explicar com eres de petit i què feies","Misión: contar cómo eras de pequeño y qué hacías","Mission: tell what you were like as a child and what you used to do","Mission : raconter comment tu étais enfant et ce que tu faisais"],v:[["txikia nintzenean",["quan era petit","cuando era pequeño","when I was little","quand j'étais petit"]],["haurtzaroa",["infantesa","infancia","childhood","enfance"]],["ikastolara joaten nintzen",["anava a l'ikastola","iba a la ikastola","I used to go to the ikastola","j'allais à l'ikastola"]],["kalean jolasten genuen",["jugàvem al carrer","jugábamos en la calle","we used to play in the street","nous jouions dans la rue"]],["aitonarekin ibiltzen nintzen",["passejava amb l'avi","paseaba con el abuelo","I used to go out with my grandfather","je me promenais avec mon grand-père"]],["udan herrira joaten ginen",["a l'estiu anàvem al poble","en verano íbamos al pueblo","in summer we used to go to the village","en été nous allions au village"]],["asko jolasten nuen",["jugava molt","jugaba mucho","I used to play a lot","je jouais beaucoup"]],["lotsatia nintzen",["era tímid","era tímido","I was shy","j'étais timide"]],["oso bizia nintzen",["era molt mogut","era muy inquieto","I was very lively","j'étais très vif"]],["txakur bat genuen",["teníem un gos","teníamos un perro","we had a dog","nous avions un chien"]],["etxe handi batean bizi ginen",["vivíem en una casa gran","vivíamos en una casa grande","we lived in a big house","nous habitions dans une grande maison"]],["orduan ez zegoen telefono mugikorrik",["aleshores no hi havia mòbils","entonces no había móviles","there were no mobile phones then","à l'époque il n'y avait pas de portables"]]],c:[{"b":["Zure haurtzaroaz hitz egiten ari zara: txikia zinenean ikastolara joaten zinen. Zer esaten duzu?",["Parles de la infantesa: de petit anaves a l'ikastola. Què dius?","Hablas de tu infancia: de pequeño ibas a la ikastola. ¿Qué dices?","You talk about your childhood: as a child you went to the ikastola. What do you say?","Tu parles de ton enfance : enfant tu allais à l'ikastola. Que dis-tu ?"]],"o":[2,3,9]},{"b":["Txikia zinenean ez zinen oso lotsatia, oso bizia baizik. Zer esaten duzu?",["De petit no eres tímid, sinó molt mogut. Què dius?","De pequeño no eras tímido, sino muy inquieto. ¿Qué dices?","As a child you weren't shy, you were very lively. What do you say?","Enfant tu n'étais pas timide mais très vif. Que dis-tu ?"]],"o":[8,7,6]},{"b":["Udan herrira joaten zineten. Zer esaten duzu?",["A l'estiu anàveu al poble. Què dius?","En verano ibais al pueblo. ¿Qué dices?","In summer you used to go to the village. What do you say?","En été vous alliez au village. Que dis-tu ?"]],"o":[5,3,10]}],s:[[["Vols dir «infantesa». Què dius?","Quieres decir «infancia». ¿Qué dices?","You want to say “childhood”. What do you say?","Tu veux dire « enfance ». Que dis-tu ?"],1,[0,8]],[["Vols dir «teníem un gos». Què dius?","Quieres decir «teníamos un perro». ¿Qué dices?","You want to say “we had a dog”. What do you say?","Tu veux dire « nous avions un chien ». Que dis-tu ?"],9,[10,3]],[["Vols dir «aleshores no hi havia mòbils». Què dius?","Quieres decir «entonces no había móviles». ¿Qué dices?","You want to say “there were no mobile phones then”. What do you say?","Tu veux dire « à l'époque il n'y avait pas de portables ». Que dis-tu ?"],11,[2,7]]]},
{t:["Repte: kontatu zer egin duzun","Reto: cuenta lo que has hecho","Challenge: tell what you did","Défi : raconte ce que tu as fait"],mis:["Missió: explicar una història del passat en ordre","Misión: contar una historia del pasado en orden","Mission: tell a story from the past in order","Mission : raconter une histoire du passé dans l'ordre"],v:[["atzo etxean egon nintzen",["ahir vaig ser a casa","ayer estuve en casa","yesterday I was at home","hier j'étais à la maison"]],["lanera joan nintzen",["vaig anar a la feina","fui al trabajo","I went to work","je suis allé au travail"]],["zinemara joan ginen",["vam anar al cinema","fuimos al cine","we went to the cinema","nous sommes allés au cinéma"]],["oso ondo pasatu genuen",["ens ho vam passar molt bé","lo pasamos muy bien","we had a great time","nous nous sommes bien amusés"]],["oporretara joan nintzen",["vaig anar de vacances","fui de vacaciones","I went on holiday","je suis parti en vacances"]],["eguraldi ona egin zuen",["va fer bon temps","hizo buen tiempo","the weather was nice","il a fait beau"]],["jada gosaldu dut",["ja he esmorzat","ya he desayunado","I've already had breakfast","j'ai déjà pris le petit-déjeuner"]],["orain bertan iritsi naiz",["acabo d'arribar","acabo de llegar","I've just arrived","je viens d'arriver"]],["lehenik",["primer","primero","first","d'abord"]],["azkenik",["finalment","finalmente","finally","enfin"]],["filma ikusi dut",["he vist una pel·lícula","he visto una película","I've seen a film","j'ai vu un film"]],["txikia nintzenean",["quan era petit","cuando era pequeño","when I was little","quand j'étais petit"]]],c:[{"b":["Atzo zinemara joan zinen lagunekin eta oso polita izan zen. Zer esaten duzu?",["Ahir vas anar al cinema amb amics i va ser molt bonic. Què dius?","Ayer fuiste al cine con amigos y fue muy bonito. ¿Qué dices?","Yesterday you went to the cinema with friends and it was great. What do you say?","Hier tu es allé au cinéma avec des amis et c'était très bien. Que dis-tu ?"]],"o":[2,3,1]},{"b":["Orain iritsi zara etxera. Zer esaten duzu?",["Acabes d'arribar a casa. Què dius?","Acabas de llegar a casa. ¿Qué dices?","You've just got home. What do you say?","Tu viens d'arriver à la maison. Que dis-tu ?"]],"o":[7,6,0]},{"b":["Istorio bat kontatzen hasten zara. Zer esaten duzu lehenengo?",["Comences a explicar una història. Què dius primer?","Empiezas a contar una historia. ¿Qué dices primero?","You start telling a story. What do you say first?","Tu commences à raconter une histoire. Que dis-tu d'abord ?"]],"o":[8,9,5]}],s:[[["Vols dir «vaig anar de vacances». Què dius?","Quieres decir «fui de vacaciones». ¿Qué dices?","You want to say “I went on holiday”. What do you say?","Tu veux dire « je suis parti en vacances ». Que dis-tu ?"],4,[5,2]],[["Vols dir «he vist una pel·lícula». Què dius?","Quieres decir «he visto una película». ¿Qué dices?","You want to say “I've seen a film”. What do you say?","Tu veux dire « j'ai vu un film ». Que dis-tu ?"],10,[11,6]],[["Vols dir «finalment». Què dius?","Quieres decir «finalmente». ¿Qué dices?","You want to say “finally”. What do you say?","Tu veux dire « enfin ». Que dis-tu ?"],9,[8,3]]]},
{t:["Bihar","Mañana","Tomorrow","Demain"],mis:["Missió: dir què faràs demà","Misión: decir qué harás mañana","Mission: say what you'll do tomorrow","Mission : dire ce que tu feras demain"],v:[["bihar lanera joango naiz",["demà aniré a la feina","mañana iré al trabajo","tomorrow I'll go to work","demain j'irai au travail"]],["etxean geratuko naiz",["em quedaré a casa","me quedaré en casa","I'll stay at home","je resterai à la maison"]],["lagun batekin elkartuko naiz",["em trobaré amb un amic","quedaré con un amigo","I'll meet a friend","je retrouverai un ami"]],["erosketak egingo ditut",["faré la compra","haré la compra","I'll do the shopping","je ferai les courses"]],["bazkaria prestatuko dut",["prepararé el dinar","prepararé la comida","I'll make lunch","je préparerai le déjeuner"]],["ikusiko dugu",["ho veurem","ya veremos","we'll see","on verra"]],["etorriko naiz",["vindré","vendré","I'll come","je viendrai"]],["egingo dut",["ho faré","lo haré","I'll do it","je le ferai"]],["jakingo dut",["ho sabré","lo sabré","I'll know","je saurai"]],["telefonoz deituko dizut",["et trucaré","te llamaré","I'll call you","je t'appellerai"]],["gero idatziko dizut",["t'escriuré després","te escribiré luego","I'll write to you later","je t'écrirai plus tard"]],["ez naiz joango",["no hi aniré","no iré","I won't go","je n'irai pas"]]],c:[{"b":["Bihar lagun batekin geratu zara. Zer esaten duzu?",["Demà has quedat amb un amic. Què dius?","Mañana has quedado con un amigo. ¿Qué dices?","Tomorrow you've arranged to meet a friend. What do you say?","Demain tu as rendez-vous avec un ami. Que dis-tu ?"]],"o":[2,1,3]},{"b":["Norbaitekin telefonoz hitz egingo duzu geroago. Zer esaten diozu?",["Parlaràs amb algú per telèfon més tard. Què li dius?","Hablarás con alguien por teléfono más tarde. ¿Qué le dices?","You'll talk to someone on the phone later. What do you say?","Tu parleras à quelqu'un au téléphone plus tard. Que lui dis-tu ?"]],"o":[9,10,5]},{"b":["Oraindik ez dakizu zer gertatuko den. Zer esaten duzu?",["Encara no saps què passarà. Què dius?","Todavía no sabes qué pasará. ¿Qué dices?","You don't know yet what will happen. What do you say?","Tu ne sais pas encore ce qui va se passer. Que dis-tu ?"]],"o":[5,6,7]}],s:[[["Vols dir «faré la compra». Què dius?","Quieres decir «haré la compra». ¿Qué dices?","You want to say “I'll do the shopping”. What do you say?","Tu veux dire « je ferai les courses ». Que dis-tu ?"],3,[4,1]],[["Vols dir «no hi aniré». Què dius?","Quieres decir «no iré». ¿Qué dices?","You want to say “I won't go”. What do you say?","Tu veux dire « je n'irai pas ». Que dis-tu ?"],11,[6,7]],[["Vols dir «t'escriuré després». Què dius?","Quieres decir «te escribiré luego». ¿Qué dices?","You want to say “I'll write to you later”. What do you say?","Tu veux dire « je t'écrirai plus tard ». Que dis-tu ?"],10,[9,8]]]},
{t:["Asmoak","Planes e intenciones","Plans and intentions","Projets et intentions"],mis:["Missió: parlar dels teus plans i intencions","Misión: hablar de tus planes e intenciones","Mission: talk about your plans and intentions","Mission : parler de tes projets et intentions"],v:[["asmoa",["pla","plan","plan","projet"]],["euskara ikasiko dut",["aprendré euskera","aprenderé euskera","I'll learn Basque","j'apprendrai le basque"]],["autoa erosiko dut",["em compraré un cotxe","me compraré un coche","I'll buy a car","j'achèterai une voiture"]],["etxea aldatuko dut",["canviaré de casa","me mudaré de casa","I'll move house","je déménagerai"]],["lana aldatuko dut",["canviaré de feina","cambiaré de trabajo","I'll change jobs","je changerai de travail"]],["bidaia bat egingo dut",["faré un viatge","haré un viaje","I'll take a trip","je ferai un voyage"]],["agian",["potser","quizás","maybe","peut-être"]],["ziur nago",["n'estic segur","estoy seguro","I'm sure","j'en suis sûr"]],["oraindik ez dakit",["encara no ho sé","todavía no lo sé","I don't know yet","je ne sais pas encore"]],["nahiago nuke",["preferiria","preferiría","I'd prefer","je préférerais"]],["gustatuko litzaidake",["m'agradaria","me gustaría","I'd like","j'aimerais"]],["nahi dut",["vull","quiero","I want","je veux"]]],c:[{"b":["Euskara maila hobetu nahi duzu. Zer esaten duzu?",["Vols millorar el teu nivell d'euskera. Què dius?","Quieres mejorar tu nivel de euskera. ¿Qué dices?","You want to improve your Basque. What do you say?","Tu veux améliorer ton niveau de basque. Que dis-tu ?"]],"o":[1,2,3]},{"b":["Ez zaude ziur zer egingo duzun. Zer esaten duzu?",["No estàs segur de què faràs. Què dius?","No estás seguro de lo que harás. ¿Qué dices?","You're not sure what you'll do. What do you say?","Tu n'es pas sûr de ce que tu feras. Que dis-tu ?"]],"o":[8,7,2]},{"b":["Zure bizitza aldatu nahi duzu eta beste etxe batera joango zara. Zer esaten duzu?",["Vols canviar de vida i te'n aniràs a una altra casa. Què dius?","Quieres {t:["Asteburuko planak","Planes del fin de semana","Weekend plans","Projets du week-end"],mis:["Missió: proposar plans i respondre'n","Misión: proponer planes y responder","Mission: suggest plans and reply to them","Mission : proposer des plans et y répondre"],v:[["asteburuan zer egingo duzu?",["què faràs el cap de setmana?","¿qué harás el fin de semana?","what will you do at the weekend?","que feras-tu ce week-end ?"]],["mendira joango naiz",["aniré a la muntanya","iré a la montaña","I'll go to the mountains","j'irai à la montagne"]],["txangoa egingo dugu",["farem una excursió","haremos una excursión","we'll go on a trip","nous ferons une excursion"]],["zerbait egin nahi duzu?",["vols fer alguna cosa?","¿quieres hacer algo?","do you want to do something?","tu veux faire quelque chose ?"]],["ideia ona da",["és una bona idea","es buena idea","it's a good idea","c'est une bonne idée"]],["nahi baduzu",["si vols","si quieres","if you want","si tu veux"]],["bazkaltzera joango gara",["anirem a dinar","iremos a comer","we'll go for lunch","nous irons déjeuner"]],["ez daukat planik",["no tinc plans","no tengo planes","I have no plans","je n'ai pas de projets"]],["libre nago",["estic lliure","estoy libre","I'm free","je suis libre"]],["beste aldi batean",["una altra vegada","otra vez","another time","une autre fois"]],["primeran!",["genial!","¡genial!","great!","super !"]],["ezin dut",["no puc","no puedo","I can't","je ne peux pas"]]],c:[{"b":["Lagun batek zinemara joatea proposatzen dizu eta nahi duzu. Zer esaten duzu?",["Un amic et proposa d'anar al cinema i vols. Què dius?","Un amigo te propone ir al cine y quieres. ¿Qué dices?","A friend suggests going to the cinema and you want to. What do you say?","Un ami te propose d'aller au cinéma et tu veux. Que dis-tu ?"]],"o":[4,9,11]},{"b":["Norbaitek galdetzen dizu zer egingo duzun igandean. Ez duzu ezer. Zer esaten duzu?",["Algú et pregunta què faràs diumenge. No tens res. Què dius?","Alguien te pregunta qué harás el domingo. No tienes nada. ¿Qué dices?","Someone asks what you'll do on Sunday. You have nothing. What do you say?","Quelqu'un te demande ce que tu feras dimanche. Tu n'as rien. Que dis-tu ?"]],"o":[7,1,6]},{"b":["Zuk zerbait proposatu nahi duzu. Zer galdetzen duzu?",["Vols proposar alguna cosa. Què preguntes?","Quieres proponer algo. ¿Qué preguntas?","You want to suggest something. What do you ask?","Tu veux proposer quelque chose. Que demandes-tu ?"]],"o":[3,8,11]}],s:[[["Vols dir «estic lliure». Què dius?","Quieres decir «estoy libre». ¿Qué dices?","You want to say “I'm free”. What do you say?","Tu veux dire « je suis libre ». Que dis-tu ?"],8,[7,10]],[["Vols dir «una altra vegada». Què dius?","Quieres decir «otra vez». ¿Qué dices?","You want to say “another time”. What do you say?","Tu veux dire « une autre fois ». Que dis-tu ?"],9,[11,4]],[["Vols dir «genial!». Què dius?","Quieres decir «¡genial!». ¿Qué dices?","You want to say “great!”. What do you say?","Tu veux dire « super ! ». Que dis-tu ?"],10,[2,5]]]},
{t:["Hitzordua","La cita","The appointment","Le rendez-vous"],mis:["Missió: demanar, canviar o cancel·lar una cita per telèfon","Misión: pedir, cambiar o cancelar una cita por teléfono","Mission: make, change or cancel an appointment by phone","Mission : prendre, changer ou annuler un rendez-vous par téléphone"],v:[["hitzordua",["cita","cita","appointment","rendez-vous"]],["hitzordu bat daukat",["tinc una cita","tengo una cita","I have an appointment","j'ai un rendez-vous"]],["zer ordutan?",["a quina hora?","¿a qué hora?","at what time?","à quelle heure ?"]],["ordu bietan",["a les dues","a las dos","at two o'clock","à deux heures"]],["goizean",["al matí","por la mañana","in the morning","le matin"]],["arratsaldean",["a la tarda","por la tarde","in the afternoon","l'après-midi"]],["aldatu nahi dut",["el vull canviar","quiero cambiarlo","I want to change it","je veux le changer"]],["bertan behera utzi",["cancel·lar","cancelar","to cancel","annuler"]],["telefonoz deitu",["trucar per telèfon","llamar por teléfono","to phone","téléphoner"]],["mezu bat utzi",["deixar un missatge","dejar un mensaje","to leave a message","laisser un message"]],["ez dago",["no hi és","no está","he/she isn't here","il/elle n'est pas là"]],["itxaron mesedez",["espereu, si us plau","espere, por favor","please wait","attendez, s'il vous plaît"]]],c:[{"b":["Astelehenean hitzordua daukazu, baina beste egun batean nahi duzu. Zer esaten duzu?",["Dilluns tens una cita, però la vols un altre dia. Què dius?","El lunes tienes una cita, pero la quieres otro día. ¿Qué dices?","You have an appointment on Monday but you want another day. What do you say?","Tu as un rendez-vous lundi, mais tu le veux un autre jour. Que dis-tu ?"]],"o":[6,10,11]},{"b":["Hitzordu bat eskatzen duzu. Zer galdetzen dizute?",["Demanes una cita. Què et pregunten?","Pides una cita. ¿Qué te preguntan?","You ask for an appointment. What do they ask you?","Tu demandes un rendez-vous. Que te demande-t-on ?"]],"o":[2,4,5]},{"b":["Deitzen duzun pertsona ez dago. Zer egiten duzu?",["La persona a qui truques no hi és. Què fas?","La persona a la que llamas no está. ¿Qué haces?","The person you call isn't there. What do you do?","La personne que tu appelles n'est pas là. Que fais-tu ?"]],"o":[9,2,4]}],s:[[["Vols dir «tinc una cita». Què dius?","Quieres decir «tengo una cita». ¿Qué dices?","You want to say “I have an appointment”. What do you say?","Tu veux dire « j'ai un rendez-vous ». Que dis-tu ?"],1,[2,3]],[["Vols dir «a les dues». Què dius?","Quieres decir «a las dos». ¿Qué dices?","You want to say “at two o'clock”. What do you say?","Tu veux dire « à deux heures ». Que dis-tu ?"],3,[4,5]],[["Vols dir «trucar per telèfon». Què dius?","Quieres decir «llamar por teléfono». ¿Qué dices?","You want to say “to phone”. What do you say?","Tu veux dire « téléphoner ». Que dis-tu ?"],8,[7,10]]]},
{t:["Gonbidapenak","Invitaciones","Invitations","Invitations"],mis:["Missió: convidar, acceptar o refusar educadament","Misión: invitar, aceptar o rechazar con educación","Mission: invite, accept or politely decline","Mission : inviter, accepter ou refuser poliment"],v:[["gonbidapena",["invitació","invitación","invitation","invitation"]],["gonbidatu nahi zaitut",["et vull convidar","quiero invitarte","I want to invite you","je veux t'inviter"]],["pozik joango naiz",["hi aniré encantat","iré encantado","I'll gladly come","j'irai avec plaisir"]],["eskerrik asko gonbidapenagatik",["gràcies per la invitació","gracias por la invitación","thanks for the invitation","merci pour l'invitation"]],["sentitzen dut",["ho sento","lo siento","I'm sorry","je suis désolé"]],["ezin dut joan",["no hi puc anar","no puedo ir","I can't go","je ne peux pas y aller"]],["zer eraman behar dut?",["què he de portar?","¿qué tengo que llevar?","what should I bring?","qu'est-ce que je dois apporter ?"]],["etxera gonbidatzen zaitut",["et convido a casa","te invito a casa","I invite you to my home","je t'invite chez moi"]],["zer nahi duzu edatera?",["què vols beure?","¿qué quieres beber?","what would you like to drink?","que veux-tu boire ?"]],["zerbait gehiago?",["alguna cosa més?","¿algo más?","anything else?","autre chose ?"]],["ezer ez",["res","nada","nothing","rien"]],["ongi etorri",["benvingut","bienvenido","welcome","bienvenue"]]],c:[{"b":["Lagun batek bere urtebetetzera gonbidatzen zaitu eta joan nahi duzu. Zer esaten duzu?",["Un amic et convida al seu aniversari i vols anar-hi. Què dius?","Un amigo te invita a su cumpleaños y quieres ir. ¿Qué dices?","A friend invites you to his birthday and you want to go. What do you say?","Un ami t'invite à son anniversaire et tu veux y aller. Que dis-tu ?"]],"o":[2,5,10]},{"b":["Gonbidapena jaso duzu baina ezin zara joan. Zer esaten duzu?",["Has rebut una invitació però no hi pots anar. Què dius?","Has recibido una invitación pero no puedes ir. ¿Qué dices?","You received an invitation but can't go. What do you say?","Tu as reçu une invitation mais tu ne peux pas y aller. Que dis-tu ?"]],"o":[5,2,3]},{"b":["Zure etxera norbait dator. Zer galdetzen diozu edatekoaz?",["Algú ve a casa teva. Què li preguntes per beure?","Alguien viene a tu casa. ¿Qué le preguntas para beber?","Someone is coming to your home. What do you ask about a drink?","Quelqu'un vient chez toi. Que lui demandes-tu comme boisson ?"]],"o":[8,6,9]}],s:[[["Vols dir «et vull convidar». Què dius?","Quieres decir «quiero invitarte». ¿Qué dices?","You want to say “I want to invite you”. What do you say?","Tu veux dire « je veux t'inviter ». Que dis-tu ?"],1,[0,7]],[["Vols dir «gràcies per la invitació». Què dius?","Quieres decir «gracias por la invitación». ¿Qué dices?","You want to say “thanks for the invitation”. What do you say?","Tu veux dire « merci pour l'invitation ». Que dis-tu ?"],3,[4,11]],[["Vols dir «què he de portar?». Què dius?","Quieres decir «¿qué tengo que llevar?». ¿Qué dices?","You want to say “what should I bring?”. What do you say?","Tu veux dire « qu'est-ce que je dois apporter ? ». Que dis-tu ?"],6,[8,9]]]},

{t:["Posta eta bankua","Correos y banco","Post office and bank","Poste et banque"],mis:["Missió: enviar una carta i fer gestions al banc","Misión: enviar una carta y hacer gestiones en el banco","Mission: send a letter and do things at the bank","Mission : envoyer une lettre et faire des démarches à la banque"],v:[["postetxea",["oficina de correus","oficina de correos","post office","bureau de poste"]],["gutuna",["carta","carta","letter","lettre"]],["zigilua",["segell","sello","stamp","timbre"]],["bidali",["enviar","enviar","to send","envoyer"]],["gutun bat bidali nahi dut",["vull enviar una carta","quiero enviar una carta","I want to send a letter","je veux envoyer une lettre"]],["banketxea",["banc","banco","bank","banque"]],["kutxazaina",["caixer automàtic","cajero automático","cash machine","distributeur de billets"]],["dirua atera",["treure diners","sacar dinero","to withdraw money","retirer de l'argent"]],["dirua sartu",["ingressar diners","ingresar dinero","to deposit money","déposer de l'argent"]],["kontua",["compte","cuenta","account","compte"]],["txartela",["targeta","tarjeta","card","carte"]],["helbidea",["adreça","dirección","address","adresse"]]],c:[{"b":["Gutun bat bidali nahi duzu. Nora joaten zara?",["Vols enviar una carta. On vas?","Quieres enviar una carta. ¿Adónde vas?","You want to send a letter. Where do you go?","Tu veux envoyer une lettre. Où vas-tu ?"]],"o":[0,5,6]},{"b":["Dirua atera nahi duzu gauean. Non egin dezakezu?",["Vols treure diners de nit. On ho pots fer?","Quieres sacar dinero por la noche. ¿Dónde puedes hacerlo?","You want to withdraw money at night. Where can you do it?","Tu veux retirer de l'argent la nuit. Où peux-tu le faire ?"]],"o":[6,0,1]},{"b":["Gutun bat bidaltzeko prezioa ordaintzen duen paper txikia. Zer da?",["El paperet que es paga per enviar una carta. Què és?","El papelito que se paga para enviar una carta. ¿Qué es?","The little paper you pay to send a letter. What is it?","Le petit papier qu'on paie pour envoyer une lettre. Qu'est-ce que c'est ?"]],"o":[2,1,11]}],s:[[["Vols dir «vull enviar una carta». Què dius?","Quieres decir «quiero enviar una carta». ¿Qué dices?","You want to say “I want to send a letter”. What do you say?","Tu veux dire « je veux envoyer une lettre ». Que dis-tu ?"],4,[3,7]],[["Vols dir «treure diners». Què dius?","Quieres decir «sacar dinero». ¿Qué dices?","You want to say “to withdraw money”. What do you say?","Tu veux dire « retirer de l'argent ». Que dis-tu ?"],7,[8,10]],[["Vols dir «banc». Què dius?","Quieres decir «banco». ¿Qué dices?","You want to say “bank”. What do you say?","Tu veux dire « banque ». Que dis-tu ?"],5,[0,9]]]},
{t:["Osasuna","La salud","Health","La santé"],mis:["Missió: explicar al metge què et passa","Misión: explicar al médico qué te pasa","Mission: tell the doctor what's wrong","Mission : expliquer au médecin ce qui ne va pas"],v:[["zer duzu?",["què tens?","¿qué tienes?","what's wrong?","qu'est-ce que tu as ?"]],["sukarra daukat",["tinc febre","tengo fiebre","I have a fever","j'ai de la fièvre"]],["eztula daukat",["tinc tos","tengo tos","I have a cough","j'ai de la toux"]],["hotzak jota nago",["estic refredat","estoy resfriado","I have a cold","je suis enrhumé"]],["sabeleko mina dut",["tinc mal de panxa","me duele el estómago","I have a stomach ache","j'ai mal au ventre"]],["hortzetako mina dut",["tinc mal de queixal","me duelen los dientes","I have toothache","j'ai mal aux dents"]],["botika",["medicament","medicina","medicine","médicament"]],["errezeta",["recepta","receta","prescription","ordonnance"]],["pastila",["pastilla","pastilla","pill","comprimé"]],["atseden hartu",["descansar","descansar","to rest","se reposer"]],["medikuarengana joan behar dut",["he d'anar al metge","tengo que ir al médico","I have to see the doctor","je dois aller chez le médecin"]],["hobeto sentitzen naiz",["em trobo millor","me siento mejor","I feel better","je me sens mieux"]]],c:[{"b":["Medikuak galdetzen dizu zer duzun. Tenperatura altua daukazu. Zer esaten duzu?",["El metge et pregunta què tens. Tens la temperatura alta. Què dius?","El médico te pregunta qué tienes. Tienes la temperatura alta. ¿Qué dices?","The doctor asks what's wrong. You have a high temperature. What do you say?","Le médecin te demande ce que tu as. Tu as de la fièvre. Que dis-tu ?"]],"o":[1,2,3]},{"b":["Medikuak paper bat ematen dizu botika erosteko. Zer da?",["El metge et dona un paper per comprar medicaments. Què és?","El médico te da un papel para comprar medicinas. ¿Qué es?","The doctor gives you a paper to buy medicine. What is it?","Le médecin te donne un papier pour acheter des médicaments. Qu'est-ce que c'est ?"]],"o":[7,6,8]},{"b":["Gaixo zaude eta etxean geratu behar duzu. Zer egin behar duzu?",["Estàs malalt i t'has de quedar a casa. Què has de fer?","Estás enfermo y tienes que quedarte en casa. ¿Qué tienes que hacer?","You're ill and have to stay at home. What do you need to do?","Tu es malade et tu dois rester à la maison. Que dois-tu faire ?"]],"o":[9,10,0]}],s:[[["Vols dir «em trobo millor». Què dius?","Quieres decir «me siento mejor». ¿Qué dices?","You want to say “I feel better”. What do you say?","Tu veux dire « je me sens mieux ». Que dis-tu ?"],11,[0,6]],[["Vols dir «tinc mal de queixal». Què dius?","Quieres decir «me duelen los dientes». ¿Qué dices?","You want to say “I have toothache”. What do you say?","Tu veux dire « j'ai mal aux dents ». Que dis-tu ?"],5,[4,3]],[["Vols dir «he d'anar al metge». Què dius?","Quieres decir «tengo que ir al médico». ¿Qué dices?","You want to say “I have to see the doctor”. What do you say?","Tu veux dire « je dois aller chez le médecin ». Que dis-tu ?"],10,[9,2]]]},

{t:["Kexak eta erreklamazioak","Quejas y reclamaciones","Complaints","Plaintes et réclamations"],mis:["Missió: explicar un problema i demanar una solució","Misión: explicar un problema y pedir una solución","Mission: explain a problem and ask for a solution","Mission : expliquer un problème et demander une solution"],v:[["arazoa",["problema","problema","problem","problème"]],["kexa",["queixa","queja","complaint","plainte"]],["ez dabil",["no funciona","no funciona","it doesn't work","ça ne marche pas"]],["hautsita dago",["està trencat","está roto","it's broken","c'est cassé"]],["zikina dago",["està brut","está sucio","it's dirty","c'est sale"]],["hotzegia da",["és massa fred","es demasiado frío","it's too cold","c'est trop froid"]],["berandu iritsi da",["ha arribat tard","ha llegado tarde","it arrived late","il est arrivé en retard"]],["konpondu mesedez",["arregleu-ho, si us plau","arréglelo, por favor","please fix it","réparez-le, s'il vous plaît"]],["dirua itzuli",["tornar els diners","devolver el dinero","to refund","rembourser"]],["arduraduna",["responsable","responsable","manager","responsable"]],["arazo bat daukat",["tinc un problema","tengo un problema","I have a problem","j'ai un problème"]],["barkatu eragozpenengatik",["disculpeu les molèsties","disculpe las molestias","sorry for the inconvenience","désolé pour le dérangement"]]],c:[{"b":["Telebista piztu duzu baina ez dago irudirik. Zer esaten duzu?",["Has encès la televisió però no hi ha imatge. Què dius?","Has encendido la televisión pero no hay imagen. ¿Qué dices?","You turn on the TV but there's no picture. What do you say?","Tu as allumé la télé mais il n'y a pas d'image. Que dis-tu ?"]],"o":[2,5,6]},{"b":["Hotelean gela zikina aurkitu duzu. Zer esaten duzu?",["Has trobat l'habitació bruta a l'hotel. Què dius?","Has encontrado la habitación sucia en el hotel. ¿Qué dices?","You found the hotel room dirty. What do you say?","Tu as trouvé la chambre d'hôtel sale. Que dis-tu ?"]],"o":[4,2,5]},{"b":["Zerbitzua txarra izan da eta dirua itzultzea nahi duzu. Zer eskatzen duzu?",["El servei ha estat dolent i vols que et tornin els diners. Què demanes?","El servicio ha sido malo y quieres que te devuelvan el dinero. ¿Qué pides?","The service was bad and you want your money back. What do you ask for?","Le service était mauvais et tu veux être remboursé. Que demandes-tu ?"]],"o":[8,7,10]}],s:[[["Vols dir «tinc un problema». Què dius?","Quieres decir «tengo un problema». ¿Qué dices?","You want to say “I have a problem”. What do you say?","Tu veux dire « j'ai un problème ». Que dis-tu ?"],10,[0,1]],[["Vols dir «responsable». Què dius?","Quieres decir «responsable». ¿Qué dices?","You want to say “manager”. What do you say?","Tu veux dire « responsable ». Que dis-tu ?"],9,[8,11]],[["Vols dir «arregleu-ho, si us plau». Què dius?","Quieres decir «arréglelo, por favor». ¿Qué dices?","You want to say “please fix it”. What do you say?","Tu veux dire « réparez-le, s'il vous plaît ». Que dis-tu ?"],7,[2,3]]]},

{t:["Gertaera bat kontatu","Contar un suceso","Telling an event","Raconter un événement"],mis:["Missió: contar un fet amb connectors i emocions","Misión: contar un suceso con conectores y emociones","Mission: tell an event using connectors and emotions","Mission : raconter un événement avec des connecteurs et des émotions"],v:[["gertatu zen",["va passar","pasó","it happened","c'est arrivé"]],["konturatu nintzen",["me'n vaig adonar","me di cuenta","I realised","je me suis rendu compte"]],["harritu nintzen",["em vaig sorprendre","me sorprendí","I was surprised","j'ai été surpris"]],["ez nuen espero",["no m'ho esperava","no lo esperaba","I didn't expect it","je ne m'y attendais pas"]],["zorionez",["afortunadament","afortunadamente","fortunately","heureusement"]],["zoritxarrez",["malauradament","desgraciadamente","unfortunately","malheureusement"]],["ustekabean",["inesperadament","inesperadamente","unexpectedly","à l'improviste"]],["hasieran",["al principi","al principio","at first","au début"]],["bitartean",["mentrestant","mientras tanto","meanwhile","pendant ce temps"]],["azkenean",["finalment","finalmente","in the end","finalement"]],["hori dela eta",["per això","por eso","because of that","à cause de cela"]],["zer gertatu zen?",["què va passar?","¿qué pasó?","what happened?","que s'est-il passé ?"]]],c:[{"b":["Istorioaren hasieran gertatzen dena kontatzen duzu. Zer esaten duzu?",["Expliques què passa al principi de la història. Què dius?","Cuentas lo que pasa al principio de la historia. ¿Qué dices?","You tell what happens at the start of the story. What do you say?","Tu racontes ce qui se passe au début de l'histoire. Que dis-tu ?"]],"o":[7,9,6]},{"b":["Dena ondo atera da. Zer esaten duzu?",["Tot ha sortit bé. Què dius?","Todo ha salido bien. ¿Qué dices?","Everything went well. What do you say?","Tout s'est bien passé. Que dis-tu ?"]],"o":[4,5,6]},{"b":["Zerbait txarra gertatu da eta sentitzen duzu. Zer esaten duzu?",["Ha passat una cosa dolenta i ho lamentes. Què
