{t:["Bizipenak","Vivencias","Experiences","Expériences"],mis:["Missió: parlar d'experiències que has viscut","Misión: hablar de experiencias que has vivido","Mission: talk about experiences you've had","Mission : parler d'expériences que tu as vécues"],v:[["inoiz izan zara…?",["has estat mai a…?","¿has estado alguna vez en…?","have you ever been to…?","es-tu déjà allé à… ?"]],["lehen aldiz",["per primera vegada","por primera vez","for the first time","pour la première fois"]],["ez dut inoiz ahaztuko",["no ho oblidaré mai","no lo olvidaré nunca","I'll never forget it","je ne l'oublierai jamais"]],["esperientzia ona izan zen",["va ser una bona experiència","fue una buena experiencia","it was a good experience","ce fut une bonne expérience"]],["hunkigarria",["emocionant","emocionante","moving","émouvant"]],["beldurgarria",["espantós","aterrador","scary","effrayant"]],["aspergarria",["avorrit","aburrido","boring","ennuyeux"]],["ahaztezina",["inoblidable","inolvidable","unforgettable","inoubliable"]],["atzerrian bizi izan naiz",["he viscut a l'estranger","he vivido en el extranjero","I've lived abroad","j'ai vécu à l'étranger"]],["duela urte batzuk",["fa uns anys","hace unos años","some years ago","il y a quelques années"]],["bizipena",["vivència","vivencia","experience","vécu"]],["inoiz ez",["mai","nunca","never","jamais"]]],c:[{"b":["Esperientzia horrek ez du ahazten uzten. Zer esaten duzu?",["Aquesta experiència no deixa oblidar. Què dius?","Esa experiencia no deja olvidar. ¿Qué dices?","That experience can't be forgotten. What do you say?","Cette expérience ne s'oublie pas. Que dis-tu ?"]],"o":[2,7,6]},{"b":["Film bat ikusi duzu eta negar egin duzu. Nolakoa izan da?",["Has vist una pel·lícula i has plorat. Com ha estat?","Has visto una película y has llorado. ¿Cómo ha sido?","You saw a film and cried. What was it like?","Tu as vu un film et tu as pleuré. Comment était-il ?"]],"o":[4,5,6]},{"b":["Lehenengo aldiz joan zara hegazkinez. Zer esaten duzu?",["Per primera vegada has anat en avió. Què dius?","Por primera vez has ido en avión. ¿Qué dices?","You've flown for the first time. What do you say?","Tu as pris l'avion pour la première fois. Que dis-tu ?"]],"o":[1,9,11]}],s:[[["Vols dir «he viscut a l'estranger». Què dius?","Quieres decir «he vivido en el extranjero». ¿Qué dices?","You want to say “I've lived abroad”. What do you say?","Tu veux dire « j'ai vécu à l'étranger ». Que dis-tu ?"],8,[7,10]],[["Vols dir «espantós». Què dius?","Quieres decir «aterrador». ¿Qué dices?","You want to say “scary”. What do you say?","Tu veux dire « effrayant ». Que dis-tu ?"],5,[4,6]],[["Vols dir «fa uns anys». Què dius?","Quieres decir «hace unos años». ¿Qué dices?","You want to say “some years ago”. What do you say?","Tu veux dire « il y a quelques années ». Que dis-tu ?"],9,[1,0]]]},
{t:["Biografia","Biografía","Biography","Biographie"],mis:["Missió: contar la vida d'una persona","Misión: contar la vida de una persona","Mission: tell the life story of a person","Mission : raconter la vie d'une personne"],v:[["biografia",["biografia","biografía","biography","biographie"]],["jaio zen",["va néixer","nació","was born","est né"]],["hil zen",["va morir","murió","died","est mort"]],["ezkondu zen",["es va casar","se casó","got married","s'est marié"]],["ikasi zuen",["va estudiar","estudió","studied","a étudié"]],["lan egin zuen",["va treballar","trabajó","worked","a travaillé"]],["bizi izan zen",["va viure","vivió","lived","a vécu"]],["hiru seme-alaba izan zituen",["va tenir tres fills","tuvo tres hijos","had three children","a eu trois enfants"]],["erretiratu zen",["es va jubilar","se jubiló","retired","a pris sa retraite"]],["idatzi zuen",["va escriure","escribió","wrote","a écrit"]],["ospetsua",["famós","famoso","famous","célèbre"]],["mendean",["al segle","en el siglo","in the century","au siècle"]]],c:[{"b":["Bere bizitzaren hasiera kontatzen duzu. Zer esaten duzu?",["Expliques l'inici de la seva vida. Què dius?","Cuentas el inicio de su vida. ¿Qué dices?","You tell about the start of his life. What do you say?","Tu racontes le début de sa vie. Que dis-tu ?"]],"o":[1,2,8]},{"b":["Bere bizitzaren bukaera kontatzen duzu. Zer esaten duzu?",["Expliques el final de la seva vida. Què dius?","Cuentas el final de su vida. ¿Qué dices?","You tell about the end of his life. What do you say?","Tu racontes la fin de sa vie. Que dis-tu ?"]],"o":[2,1,3]},{"b":["Gazte zenean unibertsitatean ibili zen. Zer esaten duzu?",["De jove va anar a la universitat. Què dius?","De joven fue a la universidad. ¿Qué dices?","When he was young he went to university. What do you say?","Jeune, il est allé à l'université. Que dis-tu ?"]],"o":[4,5,8]}],s:[[["Vols dir «es va casar». Què dius?","Quieres decir «se casó». ¿Qué dices?","You want to say “got married”. What do you say?","Tu veux dire « s'est marié ». Que dis-tu ?"],3,[2,1]],[["Vols dir «va tenir tres fills». Què dius?","Quieres decir «tuvo tres hijos». ¿Qué dices?","You want to say “had three children”. What do you say?","Tu veux dire « a eu trois enfants ». Que dis-tu ?"],7,[8,4]],[["Vols dir «famós». Què dius?","Quieres decir «famoso». ¿Qué dices?","You want to say “famous”. What do you say?","Tu veux dire « célèbre ». Que dis-tu ?"],10,[0,9]]]},
{t:["Zurrumurruak","Rumores","Rumours","Rumeurs"],mis:["Missió: parlar del que s'explica i dubtar de la informació","Misión: hablar de lo que se cuenta y dudar de la información","Mission: talk about what people say and doubt information","Mission : parler de ce qu'on raconte et douter d'une information"],v:[["zurrumurrua",["rumor","rumor","rumour","rumeur"]],["dirudienez",["pel que sembla","al parecer","apparently","apparemment"]],["esaten dute",["diuen","dicen","they say","on dit"]],["entzun dut",["he sentit","he oído","I've heard","j'ai entendu dire"]],["omen da",["segons diuen és","dicen que es","it is said to be","il paraît que c'est"]],["ez dakit egia den",["no sé si és veritat","no sé si es verdad","I don't know if it's true","je ne sais pas si c'est vrai"]],["gezurra",["mentida","mentira","lie","mensonge"]],["nork esan dizu?",["qui t'ho ha dit?","¿quién te lo ha dicho?","who told you?","qui te l'a dit ?"]],["ezin da sinetsi",["no es pot creure","no se puede creer","it's unbelievable","c'est incroyable"]],["ez esan inori",["no ho diguis a ningú","no se lo digas a nadie","don't tell anyone","ne le dis à personne"]],["sekretua",["secret","secreto","secret","secret"]],["harrigarria da",["és sorprenent","es sorprendente","it's surprising","c'est surprenant"]]],c:[{"b":["Norbaitek esan dizu bere ezkontza dela, baina ez zaude ziur. Zer esaten duzu?",["Algú t'ha dit que és el seu casament, però no n'estàs segur. Què dius?","Alguien te ha dicho que es su boda, pero no estás seguro. ¿Qué dices?","Someone told you it's his wedding, but you're not sure. What do you say?","Quelqu'un t'a dit que c'est son mariage, mais tu n'es pas sûr. Que dis-tu ?"]],"o":[5,2,3]},{"b":["Sekretu bat kontatzen diozu lagun bati. Zer eskatzen diozu?",["Expliques un secret a un amic. Què li demanes?","Le cuentas un secreto a un amigo. ¿Qué le pides?","You tell a friend a secret. What do you ask of him?","Tu confies un secret à un ami. Que lui demandes-tu ?"]],"o":[9,7,8]},{"b":["Albiste harrigarri bat entzun duzu. Zer esaten duzu?",["Has sentit una notícia sorprenent. Què dius?","Has oído una noticia sorprendente. ¿Qué dices?","You've heard surprising news. What do you say?","Tu as entendu une nouvelle surprenante. Que dis-tu ?"]],"o":[11,6,8]}],s:[[["Vols dir «pel que sembla». Què dius?","Quieres decir «al parecer». ¿Qué dices?","You want to say “apparently”. What do you say?","Tu veux dire « apparemment ». Que dis-tu ?"],1,[2,4]],[["Vols dir «qui t'ho ha dit?». Què dius?","Quieres decir «¿quién te lo ha dicho?». ¿Qué dices?","You want to say “who told you?”. What do you say?","Tu veux dire « qui te l'a dit ? ». Que dis-tu ?"],7,[8,3]],[["Vols dir «secret». Què dius?","Quieres decir «secreto». ¿Qué dices?","You want to say “secret”. What do you say?","Tu veux dire « secret ». Que dis-tu ?"],10,[0,6]]]},
{t:["Sentimenduak","Sentimientos","Feelings","Sentiments"],mis:["Missió: dir com et sents amb més matisos","Misión: decir cómo te sientes con más matices","Mission: say how you feel with more nuance","Mission : dire ce que tu ressens avec plus de nuances"],v:[["poztu naiz",["m'he alegrat","me he alegrado","I'm pleased","je suis content"]],["haserretu naiz",["m'he enfadat","me he enfadado","I got angry","je me suis fâché"]],["kezkatuta nago",["estic preocupat","estoy preocupado","I'm worried","je suis inquiet"]],["beldur naiz",["tinc por","tengo miedo","I'm afraid","j'ai peur"]],["lotsatuta nago",["estic avergonyit","estoy avergonzado","I'm embarrassed","j'ai honte"]],["nazkatuta nago",["n'estic fart","estoy harto","I'm fed up","j'en ai marre"]],["hunkituta nago",["estic emocionat","estoy emocionado","I'm moved","je suis ému"]],["harrituta nago",["estic sorprès","estoy sorprendido","I'm surprised","je suis surpris"]],["bakarrik sentitzen naiz",["em sento sol","me siento solo","I feel lonely","je me sens seul"]],["lasai nago",["estic tranquil","estoy tranquilo","I'm relaxed","je suis tranquille"]],["urduri nago",["estic nerviós","estoy nervioso","I'm nervous","je suis nerveux"]],["ilusio handia egiten dit",["m'il·lusiona molt","me hace mucha ilusión","I'm really looking forward to it","ça me fait très plaisir"]]],c:[{"b":["Bihar azterketa duzu eta ezin duzu lo egin. Zer sentitzen duzu?",["Demà tens un examen i no pots dormir. Què sents?","Mañana tienes un examen y no puedes dormir. ¿Qué sientes?","You have an exam tomorrow and can't sleep. How do you feel?","Tu as un examen demain et tu n'arrives pas à dormir. Que ressens-tu ?"]],"o":[10,9,0]},{"b":["Lagun batek ez du deitu eta ez dakizu zer gertatu den. Zer sentitzen duzu?",["Un amic no ha trucat i no saps què ha passat. Què sents?","Un amigo no ha llamado y no sabes qué ha pasado. ¿Qué sientes?","A friend hasn't called and you don't know what happened. How do you feel?","Un ami n'a pas appelé et tu ne sais pas ce qui s'est passé. Que ressens-tu ?"]],"o":[2,9,3]},{"b":["Sorpresa-festa bat prestatu dizute. Zer sentitzen duzu?",["T'han preparat una festa sorpresa. Què sents?","Te han preparado una fiesta sorpresa. ¿Qué sientes?","They've thrown you a surprise party. How do you feel?","On t'a préparé une fête surprise. Que ressens-tu ?"]],"o":[6,1,5]}],s:[[["Vols dir «em sento sol». Què dius?","Quieres decir «me siento solo». ¿Qué dices?","You want to say “I feel lonely”. What do you say?","Tu veux dire « je me sens seul ». Que dis-tu ?"],8,[9,5]],[["Vols dir «tinc por». Què dius?","Quieres decir «tengo miedo». ¿Qué dices?","You want to say “I'm afraid”. What do you say?","Tu veux dire « j'ai peur ». Que dis-tu ?"],3,[2,10]],[["Vols dir «m'he enfadat». Què dius?","Quieres decir «me he enfadado». ¿Qué dices?","You want to say “I got angry”. What do you say?","Tu veux dire « je me suis fâché ». Que dis-tu ?"],1,[7,4]]]},
{t:["Eskerrak eta barkamenak","Gracias y disculpas","Thanks and apologies","Remerciements et excuses"],mis:["Missió: agrair, demanar perdó i fer condolences amb més formalitat","Misión: agradecer, pedir perdón y dar el pésame con más formalidad","Mission: thank, apologise and give condolences more formally","Mission : remercier, s'excuser et présenter ses condoléances plus formellement"],v:[["mila esker laguntzagatik",["mil gràcies per l'ajuda","mil gracias por la ayuda","thanks a lot for your help","mille mercis pour ton aide"]],["ez dago zeren",["no hi ha de què","no hay de qué","don't mention it","il n'y a pas de quoi"]],["barkatu berandu iristeagatik",["perdó per arribar tard","perdón por llegar tarde","sorry for being late","désolé d'arriver en retard"]],["barkamena eskatzen dizut",["et demano perdó","te pido perdón","I apologise to you","je te demande pardon"]],["ez da ezer",["no és res","no es nada","it's nothing","ce n'est rien"]],["doluminak",["condolences","condolencias","condolences","condoléances"]],["bihotzez sentitzen dut",["ho sento de tot cor","lo siento de corazón","I'm deeply sorry","je suis sincèrement désolé"]],["zorionak berri onagatik",["felicitats per la bona notícia","felicidades por la buena noticia","congratulations on the good news","félicitations pour la bonne nouvelle"]],["gauza onak opa dizkizut",["et desitjo el millor","te deseo lo mejor","I wish you all the best","je te souhaite le meilleur"]],["goraintziak",["records","saludos","regards","salutations"]],["eskerrak eman",["donar les gràcies","dar las gracias","to give thanks","remercier"]],["barkamena eskatu",["demanar perdó","pedir perdón","to apologise","s'excuser"]]],c:[{"b":["Norbaitek mugitzen lagundu dizu. Zer esaten diozu?",["Algú t'ha ajudat a fer la mudança. Què li dius?","Alguien te ha ayudado con la mudanza. ¿Qué le dices?","Someone helped you move. What do you say to him?","Quelqu'un t'a aidé à déménager. Que lui dis-tu ?"]],"o":[0,1,4]},{"b":["Berandu iritsi zara bilerara. Zer esaten duzu?",["Has arribat tard a la reunió. Què dius?","Has llegado tarde a la reunión. ¿Qué dices?","You arrived late to the meeting. What do you say?","Tu es arrivé en retard à la réunion. Que dis-tu ?"]],"o":[2,4,9]},{"b":["Lagun baten senideren bat hil da. Zer esaten diozu?",["Un familiar d'un amic ha mort. Què li dius?","Un familiar de un amigo ha muerto. ¿Qué le dices?","A friend's relative has died. What do you say to him?","Un proche d'un ami est mort. Que lui dis-tu ?"]],"o":[5,7,8]}],s:[[["Vols dir «et desitjo el millor». Què dius?","Quieres decir «te deseo lo mejor». ¿Qué dices?","You want to say “I wish you all the best”. What do you say?","Tu veux dire « je te souhaite le meilleur ». Que dis-tu ?"],8,[7,9]],[["Vols dir «no hi ha de què». Què dius?","Quieres decir «no hay de qué». ¿Qué dices?","You want to say “don't mention it”. What do you say?","Tu veux dire « il n'y a pas de quoi ». Que dis-tu ?"],1,[4,0]],[["Vols dir «et demano perdó». Què dius?","Quieres decir «te pido perdón». ¿Qué dices?","You want to say “I apologise to you”. What do you say?","Tu veux dire « je te demande pardon ». Que dis-tu ?"],3,[2,6]]]},
{t:["Repte: nire bizipena","Reto: mi vivencia","Challenge: my experience","Défi : mon expérience"],mis:["Missió: explicar una vivència amb detalls, emocions i connectors","Misión: contar una vivencia con detalles, emociones y conectores","Mission: tell an experience with details, emotions and connectors","Mission : raconter une expérience avec détails, émotions et connecteurs"],v:[["hitzontzia",["xerraire","hablador","talkative","bavard"]],["zintzoa",["honest","honesto","honest","honnête"]],["gertatu zen",["va passar","pasó","it happened","c'est arrivé"]],["zorionez",["afortunadament","afortunadamente","fortunately","heureusement"]],["zoritxarrez",["malauradament","desgraciadamente","unfortunately","malheureusement"]],["lehen aldiz",["per primera vegada","por primera vez","for the first time","pour la première fois"]],["ez dut inoiz ahaztuko",["no ho oblidaré mai","no lo olvidaré nunca","I'll never forget it","je ne l'oublierai jamais"]],["jaio zen",["va néixer","nació","was born","est né"]],["dirudienez",["pel que sembla","al parecer","apparently","apparemment"]],["kezkatuta nago",["estic preocupat","estoy preocupado","I'm worried","je suis inquiet"]],["urduri nago",["estic nerviós","estoy nervioso","I'm nervous","je suis nerveux"]],["bihotzez sentitzen dut",["ho sento de tot cor","lo siento de corazón","I'm deeply sorry","je suis sincèrement désolé"]]],c:[{"b":["Esperientzia batek eragin handia izan zuen zuregan eta ez duzu ahaztuko. Zer esaten duzu?",["Una experiència t'ha marcat molt i no l'oblidaràs. Què dius?","Una experiencia te marcó mucho y no la olvidarás. ¿Qué dices?","An experience affected you deeply and you won't forget it. What do you say?","Une expérience t'a beaucoup marqué et tu ne l'oublieras pas. Que dis-tu ?"]],"o":[6,5,2]},{"b":["Bihar elkarrizketa duzu eta oso urduri zaude. Zer esaten duzu?",["Demà tens una entrevista i estàs molt nerviós. Què dius?","Mañana tienes una entrevista y estás muy nervioso. ¿Qué dices?","You have an interview tomorrow and you're very nervous. What do you say?","Tu as un entretien demain et tu es très nerveux. Que dis-tu ?"]],"o":[10,9,3]},{"b":["Lagun bat larri dago eta benetan sentitzen duzu. Zer esaten diozu?",["Un amic està malament i ho sents de debò. Què li dius?","Un amigo está mal y lo sientes de verdad. ¿Qué le dices?","A friend is in a bad way and you truly feel for him. What do you say to him?","Un ami va mal et tu compatis vraiment. Que lui dis-tu ?"]],"o":[11,4,8]}],s:[[["Vols dir «afortunadament». Què dius?","Quieres decir «afortunadamente». ¿Qué dices?","You want to say “fortunately”. What do you say?","Tu veux dire « heureusement ». Que dis-tu ?"],3,[4,5]],[["Vols dir «estic preocupat». Què dius?","Quieres decir «estoy preocupado». ¿Qué dices?","You want to say “I'm worried”. What do you say?","Tu veux dire « je suis inquiet ». Que dis-tu ?"],9,[10,1]],[["Vols dir «va néixer». Què dius?","Quieres decir «nació». ¿Qué dices?","You want to say “was born”. What do you say?","Tu veux dire « est né ». Que dis-tu ?"],7,[2,0]]]},
{t:["Iritzia ematen","Dar una opinión","Giving an opinion","Donner son avis"],mis:["Missió: donar la teva opinió i justificar-la","Misión: dar tu opinión y justificarla","Mission: give your opinion and justify it","Mission : donner ton avis et le justifier"],v:[["uste dut",["crec","creo","I think","je crois"]],["iruditzen zait",["em sembla","me parece","it seems to me","il me semble"]],["nire iritziz",["segons la meva opinió","en mi opinión","in my opinion","à mon avis"]],["zeren",["perquè","porque","because","parce que"]],["horregatik",["per això","por eso","that's why","c'est pourquoi"]],["adibidez",["per exemple","por ejemplo","for example","par exemple"]],["egia esan",["a dir veritat","a decir verdad","to tell the truth","à vrai dire"]],["dudarik gabe",["sense cap dubte","sin duda","without a doubt","sans aucun doute"]],["alde batetik",["d'una banda","por una parte","on the one hand","d'une part"]],["bestetik",["de l'altra","por otra","on the other hand","d'autre part"]],["ez dut uste",["no ho crec","no lo creo","I don't think so","je ne crois pas"]],["arrazoiak",["motius","razones","reasons","raisons"]]],c:[{"b":["Zure iritzia eman nahi duzu. Zer esaten duzu hasteko?",["Vols donar la teva opinió. Què dius per començar?","Quieres dar tu opinión. ¿Qué dices para empezar?","You want to give your opinion. What do you say to begin?","Tu veux donner ton avis. Que dis-tu pour commencer ?"]],"o":[2,8,10]},{"b":["Iritzi bat eman duzu eta arrazoia azaldu nahi duzu. Zer erabiltzen duzu?",["Has donat una opinió i vols explicar-ne el motiu. Què fas servir?","Has dado una opinión y quieres explicar el motivo. ¿Qué usas?","You gave an opinion and want to explain the reason. What do you use?","Tu as donné un avis et tu veux en expliquer la raison. Qu'utilises-tu ?"]],"o":[3,4,5]},{"b":["Adibide bat jarri nahi duzu. Zer esaten duzu?",["Vols posar un exemple. Què dius?","Quieres poner un ejemplo. ¿Qué dices?","You want to give an example. What do you say?","Tu veux donner un exemple. Que dis-tu ?"]],"o":[5,6,7]}],s:[[["Vols dir «no ho crec». Què dius?","Quieres decir «no lo creo». ¿Qué dices?","You want to say “I don't think so”. What do you say?","Tu veux dire « je ne crois pas ». Que dis-tu ?"],10,[1,0]],[["Vols dir «d'una banda». Què dius?","Quieres decir «por una parte». ¿Qué dices?","You want to say “on the one hand”. What do you say?","Tu veux dire « d'une part ». Que dis-tu ?"],8,[9,7]],[["Vols dir «per això». Què dius?","Quieres decir «por eso». ¿Qué dices?","You want to say “that's why”. What do you say?","Tu veux dire « c'est pourquoi ». Que dis-tu ?"],4,[3,6]]]},
{t:["Adostasuna eta desadostasuna","Acuerdo y desacuerdo","Agreeing and disagreeing","Accord et désaccord"],mis:["Missió: dir si hi estàs d'acord o no i matisar","Misión: decir si estás de acuerdo o no y matizar","Mission: say whether you agree or not and add nuance","Mission : dire si tu es d'accord ou non et nuancer"],v:[["arrazoia duzu",["tens raó","tienes razón","you're right","tu as raison"]],["erabat ados nago",["hi estic totalment d'acord","estoy totalmente de acuerdo","I completely agree","je suis tout à fait d'accord"]],["neurri batean ados nago",["hi estic d'acord fins a cert punt","estoy de acuerdo hasta cierto punto","I partly agree","je suis d'accord dans une certaine mesure"]],["ez nago ados",["no hi estic d'acord","no estoy de acuerdo","I disagree","je ne suis pas d'accord"]],["horrekin ez nago ados",["amb això no hi estic d'acord","con eso no estoy de acuerdo","I don't agree with that","je ne suis pas d'accord avec ça"]],["baina",["però","pero","but","mais"]],["hala ere",["tot i així","aun así","however","pourtant"]],["aldiz",["en canvi","en cambio","on the other hand","en revanche"]],["oker zaude",["t'equivoques","te equivocas","you're wrong","tu te trompes"]],["uler zaitzaket",["et puc entendre","te puedo entender","I can understand you","je peux te comprendre"]],["ez dut uste hala denik",["no crec que sigui així","no creo que sea así","I don't think so","je ne crois pas que ce soit ainsi"]],["ideia bera dut",["tinc la mateixa idea","tengo la misma idea","I have the same idea","j'ai la même idée"]]],c:[{"b":["Lagun batek zerbait esaten du eta zuk berdin uste duzu. Zer esaten duzu?",["Un amic diu una cosa i tu penses el mateix. Què dius?","Un amigo dice algo y tú piensas lo mismo. ¿Qué dices?","A friend says something and you think the same. What do you say?","Un ami dit quelque chose et tu penses la même chose. Que dis-tu ?"]],"o":[1,3,8]},{"b":["Lagun batek zerbait esaten du eta ez zaude batere ados. Zer esaten duzu?",["Un amic diu una cosa i no hi estàs gens d'acord. Què dius?","Un amigo dice algo y no estás nada de acuerdo. ¿Qué dices?","A friend says something and you don't agree at all. What do you say?","Un ami dit quelque chose et tu n'es pas du tout d'accord. Que dis-tu ?"]],"o":[4,0,1]},{"b":["Zati batean bakarrik zaude ados. Zer esaten duzu?",["Només hi estàs d'acord en part. Què dius?","Solo estás de acuerdo en parte. ¿Qué dices?","You only partly agree. What do you say?","Tu n'es d'accord qu'en partie. Que dis-tu ?"]],"o":[2,3,1]}],s:[[["Vols dir «però». Què dius?","Quieres decir «pero». ¿Qué dices?","You want to say “but”. What do you say?","Tu veux dire « mais ». Que dis-tu ?"],5,[6,7]],[["Vols dir «t'equivoques». Què dius?","Quieres decir «te equivocas». ¿Qué dices?","You want to say “you're wrong”. What do you say?","Tu veux dire « tu te trompes ». Que dis-tu ?"],8,[0,3]],[["Vols dir «et puc entendre». Què dius?","Quieres decir «te puedo entender». ¿Qué dices?","You want to say “I can understand you”. What do you say?","Tu veux dire « je peux te comprendre ». Que dis-tu ?"],9,[10,11]]]},
{t:["Alderatzea","Comparar","Comparing","Comparer"],mis:["Missió: comparar opcions: avantatges i inconvenients","Misión: comparar opciones: ventajas e inconvenientes","Mission: compare options: pros and cons","Mission : comparer des options : avantages et inconvénients"],v:[["abantaila",["avantatge","ventaja","advantage","avantage"]],["desabantaila",["desavantatge","desventaja","disadvantage","inconvénient"]],["alde onak",["aspectes positius","aspectos positivos","pros","points positifs"]],["alde txarrak",["aspectes negatius","aspectos negativos","cons","points négatifs"]],["alderatuta",["comparat amb","comparado con","compared to","comparé à"]],["berdina da",["és el mateix","es lo mismo","it's the same","c'est pareil"]],["ezberdina da",["és diferent","es diferente","it's different","c'est différent"]],["antzekoa da",["és semblant","es parecido","it's similar","c'est semblable"]],["aukera",["opció","opción","option","option"]],["hobe da",["és millor","es mejor","it's better","c'est mieux"]],["merezi du",["val la pena","merece la pena","it's worth it","ça vaut la peine"]],["ez du merezi",["no val la pena","no merece la pena","it's not worth it","ça n'en vaut pas la peine"]]],c:[{"b":["Zerbait ona da zuretzat: dirua aurrezten duzu. Zer da?",["Una cosa és bona per a tu: estalvies diners. Què és?","Algo es bueno para ti: ahorras dinero. ¿Qué es?","Something is good for you: you save money. What is it?","Quelque chose est bon pour toi : tu économises de l'argent. Qu'est-ce que c'est ?"]],"o":[0,1,3]},{"b":["Bi gauza antzekoak dira, ia berdinak. Zer esaten duzu?",["Dues coses són semblants, gairebé iguals. Què dius?","Dos cosas son parecidas, casi iguales. ¿Qué dices?","Two things are alike, almost the same. What do you say?","Deux choses sont semblables, presque identiques. Que dis-tu ?"]],"o":[7,5,6]},{"b":["Prezioa altua da eta ez zaizu komeni. Zer esaten duzu?",["El preu és alt i no et convé. Què dius?","El precio es alto y no te conviene. ¿Qué dices?","The price is high and it doesn't suit you. What do you say?","Le prix est élevé et ça ne te convient pas. Que dis-tu ?"]],"o":[11,10,9]}],s:[[["Vols dir «aspectes positius». Què dius?","Quieres decir «aspectos positivos». ¿Qué dices?","You want to say “pros”. What do you say?","Tu veux dire « points positifs ». Que dis-tu ?"],2,[3,1]],[["Vols dir «opció». Què dius?","Quieres decir «opción». ¿Qué dices?","You want to say “option”. What do you say?","Tu veux dire « option ». Que dis-tu ?"],8,[4,0]],[["Vols dir «val la pena». Què dius?","Quieres decir «merece la pena». ¿Qué dices?","You want to say “it's worth it”. What do you say?","Tu veux dire « ça vaut la peine ». Que dis-tu ?"],10,[11,9]]]},
{t:["Aholkuak","Consejos","Advice","Conseils"],mis:["Missió: donar i demanar consells","Misión: dar y pedir consejos","Mission: give and ask for advice","Mission : donner et demander des conseils"],v:[["aholkua",["consell","consejo","advice","conseil"]],["komeni zaizu",["et convé","te conviene","you should","tu devrais"]],["hobe duzu",["faries millor","más te vale","you'd better","tu ferais mieux de"]],["kontuz ibili",["vés amb compte","ten cuidado","be careful","fais attention"]],["ez ahaztu",["no t'oblidis","no olvides","don't forget","n'oublie pas"]],["saiatu",["prova-ho","inténtalo","try","essaie"]],["lasai hartu",["pren-t'ho amb calma","tómatelo con calma","take it easy","prends ton temps"]],["ez larritu",["no et neguitegis","no te agobies","don't worry","ne t'inquiète pas"]],["erretzeari utzi",["deixar de fumar","dejar de fumar","quit smoking","arrêter de fumer"]],["ur asko edan",["beure molta aigua","beber mucha agua","drink lots of water","boire beaucoup d'eau"]],["goiz oheratu",["anar a dormir d'hora","acostarse temprano","go to bed early","se coucher tôt"]],["atseden hartu",["descansar","descansar","rest","se reposer"]]],c:[{"b":["Lagun bat estresatuta dago. Zer esaten diozu?",["Un amic està estressat. Què li dius?","Un amigo está estresado. ¿Qué le dices?","A friend is stressed. What do you say to him?","Un ami est stressé. Que lui dis-tu ?"]],"o":[6,4,5]},{"b":["Lagun batek lo gutxi egiten du. Zer aholkatzen diozu?",["Un amic dorm poc. Què li aconselles?","Un amigo duerme poco. ¿Qué le aconsejas?","A friend sleeps little. What do you advise him?","Un ami dort peu. Que lui conseilles-tu ?"]],"o":[10,8,9]},{"b":["Lagun bat larri dago azterketagatik. Zer esaten diozu?",["Un amic està angoixat per un examen. Què li dius?","Un amigo está agobiado por un examen. ¿Qué le dices?","A friend is overwhelmed by an exam. What do you say to him?","Un ami est stressé par un examen. Que lui dis-tu ?"]],"o":[7,3,4]}],s:[[["Vols dir «consell». Què dius?","Quieres decir «c {t:["Proposamenak eta aukerak","Propuestas y opciones","Proposals and options","Propositions et options"],mis:["Missió: fer propostes i triar entre opcions","Misión: hacer propuestas y elegir entre opciones","Mission: make proposals and choose between options","Mission : faire des propositions et choisir entre plusieurs options"],v:[["zergatik ez?",["per què no?","¿por qué no?","why not?","pourquoi pas ?"]],["proposamena",["proposta","propuesta","proposal","proposition"]],["aukera bat da",["és una opció","es una opción","it's an option","c'est une option"]],["beste aukera bat",["una altra opció","otra opción","another option","une autre option"]],["nahiago dut… baino",["prefereixo… que…","prefiero… que…","I prefer… to…","je préfère… à…"]],["hobe litzateke",["seria millor","sería mejor","it would be better","ce serait mieux"]],["onartu",["acceptar","aceptar","to accept","accepter"]],["baztertu",["rebutjar","rechazar","to reject","rejeter"]],["hautatu",["triar","elegir","to choose","choisir"]],["erabaki dut",["he decidit","he decidido","I've decided","j'ai décidé"]],["pentsatu behar dut",["ho he de pensar","tengo que pensarlo","I need to think about it","je dois y réfléchir"]],["zer iruditzen zaizu proposamena?",["què et sembla la proposta?","¿qué te parece la propuesta?","what do you think of the proposal?","que penses-tu de la proposition ?"]]],c:[{"b":["Lagun batek zerbait proposatzen dizu eta ez zaude ziur. Zer esaten duzu?",["Un amic et proposa una cosa i no n'estàs segur. Què dius?","Un amigo te propone algo y no estás seguro. ¿Qué dices?","A friend suggests something and you're not sure. What do you say?","Un ami te propose quelque chose et tu n'es pas sûr. Que dis-tu ?"]],"o":[10,6,7]},{"b":["Proposamen bat ez zaizu gustatzen eta ez duzu onartzen. Zer egiten duzu?",["Una proposta no t'agrada i no l'acceptes. Què fas?","Una propuesta no te gusta y no la aceptas. ¿Qué haces?","You don't like a proposal and you don't accept it. What do you do?","Une proposition ne te plaît pas et tu ne l'acceptes pas. Que fais-tu ?"]],"o":[7,6,8]},{"b":["Zerbait proposatu nahi duzu. Zer galdetzen duzu?",["Vols proposar alguna cosa. Què preguntes?","Quieres proponer algo. ¿Qué preguntas?","You want to suggest something. What do you ask?","Tu veux proposer quelque chose. Que demandes-tu ?"]],"o":[0,9,5]}],s:[[["Vols dir «què et sembla la proposta?». Què dius?","Quieres decir «¿qué te parece la propuesta?». ¿Qué dices?","You want to say “what do you think of the proposal?”. What do you say?","Tu veux dire « que penses-tu de la proposition ? ». Que dis-tu ?"],11,[0,5]],[["Vols dir «he decidit». Què dius?","Quieres decir «he decidido». ¿Qué dices?","You want to say “I've decided”. What do you say?","Tu veux dire « j'ai décidé ». Que dis-tu ?"],9,[10,8]],[["Vols dir «una altra opció». Què dius?","Quieres decir «otra opción». ¿Qué dices?","You want to say “another option”. What do you say?","Tu veux dire « une autre option ». Que dis-tu ?"],3,[2,1]]]},
{t:["Eztabaida","El debate","Debate","Débat"],mis:["Missió: participar en una discussió amb arguments","Misión: participar en una discusión con argumentos","Mission: take part in a discussion with arguments","Mission : participer à une discussion avec des arguments"],v:[["eztabaida",["debat","debate","debate","débat"]],["alde nago",["hi estic a favor","estoy a favor","I'm in favour","je suis pour"]],["kontra nago",["hi estic en contra","estoy en contra","I'm against","je suis contre"]],["argudioa",["argument","argumento","argument","argument"]],["kontuan hartu behar da",["s'ha de tenir en compte","hay que tener en cuenta","it must be taken into account","il faut en tenir compte"]],["ez da hain erraza",["no és tan fàcil","no es tan fácil","it's not that easy","ce n'est pas si facile"]],["bi aldeak",["les dues parts","las dos partes","both sides","les deux côtés"]],["gainera",["a més","además","besides","de plus"]],["dudarik ez dago",["no hi ha dubte","no hay duda","there's no doubt","il n'y a pas de doute"]],["ez nago ziur",["no n'estic segur","no estoy seguro","I'm not sure","je n'en suis pas sûr"]],["agian arrazoia duzu",["potser tens raó","quizás tengas razón","maybe you're right","peut-être as-tu raison"]],["ikuspuntua",["punt de vista","punto de vista","point of view","point de vue"]]],c:[{"b":["Proposamen bat gustatzen zaizu eta babesten duzu. Zer esaten duzu?",["Una proposta t'agrada i la defenses. Què dius?","Una propuesta te gusta y la defiendes. ¿Qué dices?","You like a proposal and support it. What do you say?","Une proposition te plaît et tu la défends. Que dis-tu ?"]],"o":[1,2,5]},{"b":["Proposamenarekin ez zaude ados eta aurka zaude. Zer esaten duzu?",["No estàs d'acord amb la proposta i hi estàs en contra. Què dius?","No estás de acuerdo con la propuesta y estás en contra. ¿Qué dices?","You disagree with the proposal and are against it. What do you say?","Tu n'es pas d'accord avec la proposition et tu es contre. Que dis-tu ?"]],"o":[2,1,8]},{"b":["Argudio bat gehitu nahi duzu. Zer esaten duzu?",["Vols afegir un argument. Què dius?","Quieres añadir un argumento. ¿Qué dices?","You want to add an argument. What do you say?","Tu veux ajouter un argument. Que dis-tu ?"]],"o":[7,5,6]}],s:[[["Vols dir «punt de vista». Què dius?","Quieres decir «punto de vista». ¿Qué dices?","You want to say “point of view”. What do you say?","Tu veux dire « point de vue ». Que dis-tu ?"],11,[3,0]],[["Vols dir «no n'estic segur». Què dius?","Quieres decir «no estoy seguro». ¿Qué dices?","You want to say “I'm not sure”. What do you say?","Tu veux dire « je n'en suis pas sûr ». Que dis-tu ?"],9,[8,10]],[["Vols dir «debat». Què dius?","Quieres decir «debate». ¿Qué dices?","You want to say “debate”. What do you say?","Tu veux dire « débat ». Que dis-tu ?"],0,[6,3]]]},
{t:["Arrazoiak eta ondorioak","Razones y consecuencias","Reasons and results","Raisons et conséquences"],mis:["Missió: lligar idees amb connectors","Misión: enlazar ideas con conectores","Mission: link ideas with connectors","Mission : relier les idées avec des connecteurs"],v:[["zeren",["perquè","porque","because","car"]],["beraz",["per tant","por tanto","so","donc"]],["horregatik",["per això","por eso","that's why","c'est pourquoi"]],["nahiz eta",["encara que","aunque","although","bien que"]],["bestela",["si no","si no","otherwise","sinon"]],["batez ere",["sobretot","sobre todo","especially","surtout"]],["esate baterako",["per exemple","por ejemplo","for instance","par exemple"]],["laburbilduz",["en resum","en resumen","in short","en résumé"]],["ondorioz",["com a conseqüència","como consecuencia","as a result","par conséquent"]],["hala ere",["tot i així","aun así","however","pourtant"]],["gainera",["a més","además","besides","de plus"]],["dena den",["en qualsevol cas","de todos modos","anyway","de toute façon"]]],c:[{"b":["Zerbaiten arrazoia eman behar duzu. Zer erabiltzen duzu?",["Has de donar el motiu d'una cosa. Què fas servir?","Tienes que dar el motivo de algo. ¿Qué usas?","You need to give the reason for something. What do you use?","Tu dois donner la raison de quelque chose. Qu'utilises-tu ?"]],"o":[0,1,5]},{"b":["Ondorio bat atera nahi duzu. Zer erabiltzen duzu?",["Vols treure una conclusió. Què fas servir?","Quieres sacar una conclusión. ¿Qué usas?","You want to draw a conclusion. What do you use?","Tu veux tirer une conclusion. Qu'utilises-tu ?"]],"o":[1,0,3]},{"b":["Dena laburbildu nahi duzu. Zer esaten duzu?",["Vols resumir-ho tot. Què dius?","Quieres resumirlo todo. ¿Qué dices?","You want to sum it all up. What do you say?","Tu veux tout résumer. Que dis-tu ?"]],"o":[7,4,6]}],s:[[["Vols dir «encara que». Què dius?","Quieres decir «aunque». ¿Qué dices?","You want to say “although”. What do you say?","Tu veux dire « bien que ». Que dis-tu ?"],3,[10,4]],
