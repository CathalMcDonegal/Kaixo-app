s:[[["Coneixes algú al matí. Quina salutació fas servir?","Conoces a alguien por la mañana. ¿Qué saludo usas?","You meet someone in the morning. Which greeting do you use?","Tu rencontres quelqu'un le matin. Quelle salutation utilises-tu ?"],1,[11,4]],[["Vols saber com es diu algú. Què preguntes?","Quieres saber cómo se llama alguien. ¿Qué preguntas?","You want to know someone's name. What do you ask?","Tu veux savoir comment quelqu'un s'appelle. Que demandes-tu ?"],5,[7,2]],[["Algú et diu «Pozten naiz zu ezagutzeaz!». Què respons?","Alguien te dice «Pozten naiz zu ezagutzeaz!». ¿Qué respondes?","Someone says “Pozten naiz zu ezagutzeaz!” to you. What do you answer?","Quelqu'un te dit « Pozten naiz zu ezagutzeaz ! ». Que réponds-tu ?"],10,[5,11]]]},

utilises-tu ?"],0,[5,9]]]},

ou. Which word do you use?","Tu parles de la personne qui t'enseigne. Quel mot utilises-tu ?"],4,[5,3]],[["Parles de gent en general. Quina paraula uses?","Hablas de gente en general. ¿Qué palabra usas?","You talk about people in general. Which word do you use?","Tu parles des gens en général. Quel mot utilises-tu ?"],11,[0,10]]]},

?","You want to say a person is pretty. Which word do you use?","Tu veux dire qu'une personne est jolie. Quel mot utilises-tu ?"],10,[11,3]]]},

You want to say you're happy. What do you say?","Tu veux dire que tu es content. Que dis-tu ?"],0,[1,2]],[["Algú sempre treballa molt. Com és?","Alguien siempre trabaja mucho. ¿Cómo es?","Someone always works a lot. What is he like?","Quelqu'un travaille toujours beaucoup. Comment est-il ?"],9,[10,7]],[["Algú mai vol fer res. Com és?","Alguien nunca quiere hacer nada. ¿Cómo es?","Someone never wants to do anything. What is he like?","Quelqu'un ne veut jamais rien faire. Comment est-il ?"],10,[9,8]]]},
{t:["Gustos","Gustos","Likes","Goûts"],mis:["Missió: dir què t'agrada i què no","Misión: decir qué te gusta y qué no","Mission: say what you like and don't like","Mission : dire ce que tu aimes et ce que tu n'aimes pas"],v:[["kafea gustatzen zait",["m'agrada el cafè","me gusta el café","I like coffee","j'aime le café"]],["ez zait kafea gustatzen",["no m'agrada el cafè","no me gusta el café","I don't like coffee","je n'aime pas le café"]],["txokolatea asko gustatzen zait",["m'agrada molt la xocolata","me gusta mucho el chocolate","I like chocolate a lot","j'aime beaucoup le chocolat"]],["futbola gustatzen zait",["m'agrada el futbol","me gusta el fútbol","I like football","j'aime le football"]],["txakurrak gustatzen zaizkit",["m'agraden els gossos","me gustan los perros","I like dogs","j'aime les chiens"]],["zuri musika gustatzen zaizu?",["t'agrada la música?","¿te gusta la música?","do you like music?","tu aimes la musique ?"]],["bai, asko",["sí, molt","sí, mucho","yes, a lot","oui, beaucoup"]],["ez, batere ez",["no, gens","no, nada","no, not at all","non, pas du tout"]],["pixka bat",["una mica","un poco","a little","un peu"]],["nahi dut",["vull","quiero","I want","je veux"]],["tea nahiago dut",["prefereixo el te","prefiero el té","I prefer tea","je préfère le thé"]],["ez zait gustatzen",["no m'agrada","no me gusta","I don't like it","ça ne me plaît pas"]]],c:[{"b":["Kafea ez zaizu gustatzen. Zer esaten duzu?",["No t'agrada el cafè. Què dius?","No te gusta el café. ¿Qué dices?","You don't like coffee. What do you say?","Tu n'aimes pas le café. Que dis-tu ?"]],"o":[1,0,2]},{"b":["Txokolatea oso gustuko duzu. Zer esaten duzu?",["T'agrada moltíssim la xocolata. Què dius?","Te gusta muchísimo el chocolate. ¿Qué dices?","You really like chocolate. What do you say?","Tu adores le chocolat. Que dis-tu ?"]],"o":[2,1,11]},{"b":["Txakurrak asko gustatzen zaizkizu. Zer esaten duzu?",["T'agraden molt els gossos. Què dius?","Te gustan mucho los perros. ¿Qué dices?","You like dogs a lot. What do you say?","Tu aimes beaucoup les chiens. Que dis-tu ?"]],"o":[4,0,3]}],s:[[["Vols preguntar a algú si li agrada la música. Què preguntes?","Quieres preguntar a alguien si le gusta la música. ¿Qué preguntas?","You want to ask someone if they like music. What do you ask?","Tu veux demander à quelqu'un s'il aime la musique. Que demandes-tu ?"],5,[1,9]],[["No t'agrada gens el futbol. Què respons?","No te gusta nada el fútbol. ¿Qué respondes?","You don't like football at all. What do you answer?","Tu n'aimes pas du tout le football. Que réponds-tu ?"],7,[6,8]],[["Vols dir que prefereixes el te. Què dius?","Quieres decir que prefieres el té. ¿Qué dices?","You want to say you prefer tea. What do you say?","Tu veux dire que tu préfères le thé. Que dis-tu ?"],10,[0,9]]]},

hat do you say?","Un livre coûte 100 euros. Que dis-tu ?"]],"o":[9,10,3]}],s:[[["Vols preguntar a algú què li sembla. Què preguntes?","Quieres preguntar a alguien qué le parece. ¿Qué preguntas?","You want to ask someone what they think. What do you ask?","Tu veux demander à quelqu'un ce qu'il en pense. Que demandes-tu ?"],1,[0,7]],[["Vols dir que alguna cosa és molt bona. Què dius?","Quieres decir que algo es muy bueno. ¿Qué dices?","You want to say something is very good. What do you say?","Tu veux dire que quelque chose est très bien. Que dis-tu ?"],2,[4,3]],[["Vols dir que alguna cosa és barata. Què dius?","Quieres decir que algo es barato. ¿Qué dices?","You want to say something is cheap. What do you say?","Tu veux dire que quelque chose est bon marché. Que dis-tu ?"],10,[9,11]]]},

function intro(i,push=true){if(push){try{history.pushState({v:"intro",i},"",location.href)}catch(e){}}const L=LS[i];document.getElementById("app").innerHTML=`<button class="back" onclick="go('learn')">← ${t(N.learn)}</button><h2 class="vt">${t(U.lesson)} ${i+1} · ${t(L.t)}</h2><p class="mut">${t(L.mis)}</p><h3>🧠 ${t(SN[2])}</h3>${L.v.map(v=>`<div class="row"><span>${im(v[0])}<span class="eu">${v[0]}</span> ${sp(v[0])}</span><span class="sm">${t(v[1])}</span></div>`).join("")}<button class="pri" onclick="lesson(${i})">${t(U.go)} · 30</button>`}
function learnHtml(){let k=0;return MOD.map(m=>{const s0=k;let h=`<div class="row"><b>${t(m[0])}</b><span class="sm">${st.dn.filter(d=>d>=s0&&d<s0+m[1]).length}/${m[1]}</span></div>`;for(let n=0;n<m[1];n++,k++){if(LS[k]){const open=st.dn.includes(k)||k===0||st.dn.includes(k-1);h+=open?`<button class="opt" onclick="intro(${k})"><span class="eu">${k+1} · ${t(LS[k].t)}</span> ${st.dn.includes(k)?"✅":"▶"}</button>`:`<div class="row mut"><span>${k+1} · ${t(LS[k].t)}</span><span>🔒 ${t(U.lock)}</span></div>`}else if(s0==0)h+=`<div class="row mut"><span>${k+1}</span><span>🔒 ${t(U.soonL)}</span></div>`}return h}).join("")}
function lesson(i,push=true){if(push){try{history.pushState({v:"lesson",i},"",location.href)}catch(e){}}cl=i;const q=[];for(let k=0;k<12;k++)q.push({s:k<6?2:3,k:"a",i:k});[0,1,3,4,6,7,8,10].forEach(k=>q.push({s:4,k:"b",i:k}));LS[i].c.forEach((c,j)=>q.push({s:5,k:"c",j}));LS[i].s.forEach((c,j)=>q.push({s:5,k:"d",j}));[2,5,9,11].forEach(k=>q.push({s:6,k:"b",i:k}));
LQs=q;qi=0;sc=0;optPos=0;document.getElementById("app").innerHTML=`<button class="back" onclick="go('learn')">← ${t(N.learn)}</button><div id="conv"></div>`;showQ()}
function showQ(){const el=document.getElementById("conv"),L=LS[cl],V=L.v;el.classList.remove("rev");ldone=0;tr1=0;
if(qi>=LQs.length){if(!st.dn.includes(cl))st.dn.push(cl);const td=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(st.day!=td){st.s=st.day==y?st.s+1:1;st.day=td}sv();
el.innerHTML=`<div class="soon"><h2>🏆 ${t(U.fin)}</h2><p>${sc}/${LQs.length} ${t(U.first)}</p>${cl+1<LS.length?`<button class="pri" onclick="intro(${cl+1})">${t(U.nextL)}</button>`:""}<button class="pri" onclick="go('learn')">${t(N.learn)}</button><button class="pri" onclick="lesson(${cl})">${t(U.again)}</button></div>`;return}
const q=LQs[qi];let auto=null,h=`<div class="bar"><i style="width:${qi/LQs.length*100}%"></i></div><p class="sm">${qi+1}/${LQs.length} · ${S[q.s]} ${t(SN[q.s])}</p>`,o,m4=i=>{const r=[i];while(r.length<4){const x=Math.floor(Math.random()*12);if(!r.includes(x))r.push(x)}return shuf(r)};
if(q.k=="a"){const w=V[q.i][0];if(q.s==3&&hasAudio()){auto=w;h+=`<div class="pc"><button class="say big3" onclick="say('${w.replace(/'/g,"\\'")}')">🔊</button><div class="sm">${t(U.listen)}</div></div>`}else h+=`<div class="pc">${im(w,1)}<span class="eu big2">${w}</span> ${sp(w)}</div>`;o=balanceOpts(m4(q.i).map(j=>[t(V[j][1]),j==q.i]))}
else if(q.k=="b"){h+=`<div class="pc">${im(V[q.i][0],1)}<span class="big2">${t(V[q.i][1])}</span></div>`;o=balanceOpts(m4(q.i).map(j=>[V[j][0],j==q.i,1]))}
else if(q.k=="c"){const c=L.c[q.j];h+=`<div class="bub"><span class="av">🧑</span><div><span class="eu">${c.b[0]}</span> ${sp(c.b[0])}<div class="sm">${t(c.b[1])}</div></div></div><p class="sm rt">${t(U.rep)}</p>`;o=balanceOpts(c.o.map((x,n)=>typeof x=="number"?[V[x][0],n==0,1,t(V[x][1])]:[x[0],n==0,1,t(x[1])]))}
else{const c=L.s[q.j];h+=`<div class="pc">${t(c[0])}</div>`;o=balanceOpts([[V[c[1]][0],1,1],...c[2].map(x=>[V[x][0],0,1])])}
o=arrange(o);LO=o;el.innerHTML=h+o.map((x,n)=>`<button class="opt ${q.k=="c"?"rp":""}" onclick="lp(${n},this)"><span class="${x[2]?"eu":""}">${x[0]}</span>${x[3]?`<div class="sm tr">${x[3]}</div>`:""}</button>`).join("")+`<div id="fb"></div>`;if(auto)say(auto)}
function lp(n,el){if(ldone)return;const o=LO[n];document.getElementById("conv").classList.add("rev");
if(o[1]){el.classList.add("ok");ldone=1;if(!tr1){sc++;st.p+=10;sv()}document.getElementById("fb").innerHTML=`<p><b>✅ ${t(U.ok)}</b></p><button class="pri" onclick="qi++;showQ()">${t(U.next)}</button>`}
else{el.classList.add("bad");tr1=1;document.getElementById("fb").innerHTML=`<p>❌ ${t(U.no)}</p>`}}
function find(q){q=q.trim().toLowerCase();const r=document.getElementById("res");if(!q){r.innerHTML="";return}
const m=DICT.filter(d=>d[0].includes(q)||d[1].some(x=>x.includes(q)));
r.innerHTML=m.length?m.map(d=>`<div class="row"><span class="eu">${d[0]}</span><span>${t(d[1])}</span></div>`).join(""):`<p class="mut">${t(U.none)}</p>`}
function go(v,push=true){if(push&&v!==cur){try{history.pushState({v},"",location.href)}catch(e){}}cur=v;document.documentElement.lang=lang;const a=document.getElementById("app");
if(v=="home"){let nx=LS.findIndex((l,i)=>!st.dn.includes(i));if(nx<0)nx=LS.length-1;
const LN={ca:"Català",es:"Español",en:"English",fr:"Français"};
a.innerHTML=`<div class="top">${LOGO}<h1>KAIXO</h1><select class="lsel" aria-label="Idioma" onchange="setLang(this.value)">${I.map(c=>`<option value="${c}" ${c==lang?"selected":""}>${LN[c]}</option>`).join("")}</select></div>
<div class="stats"><div class="st">🔥<b>${st.s}</b><small>${t(U.streak)}</small></div><div class="st">⭐<b>${st.p}</b><small>${t(U.points)}</small></div><div class="st">A1<b>${Math.round(st.dn.length/40*100)}%</b><small>${t(U.prog)}</small></div></div>
<div class="bar"><i style="width:${st.dn.length/40*100}%"></i></div>
<section class="cta"><small>${t(U.cont)}</small><h2>${t(U.lesson)} ${nx+1} · ${t(LS[nx].t)}</h2><p>${t(LS[nx].mis)}</p><div class="chips">${S.map((e,i)=>`<span class="${i?"":"cur"}">${e} ${t(SN[i])}</span>`).join("")}</div><button class="go" onclick="intro(${nx})">${t(U.go)}</button></section>
<div class="grid">${[["learn","🎓"],["tales","📖"],["music","🎵"],["agenda","🎉"],["vocab","🖼️"],["trans","🔁"],["abc","🔤"],["num","🔢"]].map(([k,e])=>`<button class="tile" onclick="go('${k}')"><span>${e}</span>${t(N[k])}</button>`).join("")}</div>`;return}
const em={learn:"🎓",tales:"📖",music:"🎵",agenda:"🎉",trans:"🔁",abc:"🔤",num:"🔢",vocab:"🖼️"}[v];
let x=`<button class="back" onclick="go('home')">← ${t(N.home)}</button><h2 class="vt">${em} ${t(N[v])}</h2><p class="mut">${t(D[v]||[""])}</p>`;
const lock=`<div class="row mut"><b>A2</b><span>🔒 ${t(U.lock)}</span></div><div class="row mut"><b>B1</b><span>🔒 ${t(U.lock)}</span></div>`;
if(v=="learn")x+=learnHtml();
else if(v=="tales")x+=`<div class="row"><b>A1</b></div>${TALE.map((l,i)=>`<button class="opt" onclick="shown[${i}]=!shown[${i}];go('tales')"><span class="eu">${l[0]}</span>${shown[i]?`<div class="sm">${t(l[1])}</div>`:""}</button>`).join("")}${lock}`;
else if(v=="agenda")x+=FEST.map(f=>{const d=new Date(2026,f[1]-1,f[0]||1),o=f[0]?{day:"numeric",month:"long"}:{month:"long"};let s=d.toLocaleDateString(lang,o);if(f[2])s=f[0]+"–"+f[2]+" "+d.toLocaleDateString(lang,{month:"long"});return`<div class="row"><div><div class="eu">${f[3]}</div><div class="sm">${f[4]}</div></div><span>${s}</span></div>`}).join("");
else if(v=="trans")x+=`<input id="q" placeholder="${t(U.ph)}" oninput="find(this.value)"><div id="res"></div><p class="sm">${t(U.dict)}</p>`;
else if(v=="abc")x+=`<div class="abc">${"A B C D E F G H I J K L M N Ñ O P Q R S T U V W X Y Z TX TS TZ DZ".split(" ").map(c=>`<button type="button" onclick="say('${c}')">${c}<small>🔊</small></button>`).join("")}</div><h3>🔊 ${t(N.abc)}</h3>${SOUNDS.map(s=>`<div class="row"><span><b>${s[0]}</b> · <span class="eu">${s[1]}</span> ${sp(s[1])}</span><span>${sayBtn(s[1])}</span></div><div class="sm" style="margin:-8px 0 10px 12px">${t(s[2])}</div>`).join("")}`;
else if(v=="vocab")x+=`<div id="card"></div><h3>${t(N.vocab)}</h3><div id="wl">${wl()}</div>`;
else if(v=="num")x+=`<div class="nums">${["zero","bat","bi","hiru","lau","bost","sei","zazpi","zortzi","bederatzi","hamar","hamaika","hamabi","hamahiru","hamalau","hamabost","hamasei","hamazazpi","hemezortzi","hemeretzi","hogei"].map((n,i)=>`<div><b>${i}</b><span class="eu">${n}</span> ${sp(n)}${sayBtn(n)}</div>`).join("")}</div><p class="sm">${t(D.num)}</p>`;
else x+=`<div class="soon">🚧 ${t(U.soon)}</div>`;
a.innerHTML=x;if(v=="vocab"){done=0;card()}}
try{history.replaceState({v:"home"},"",location.href);addEventListener("popstate",e=>{const s=e.state||{v:"home"};if(s.v==="intro")intro(s.i,false);else if(s.v==="lesson")lesson(s.i,false);else go(s.v||"home",false)})}catch(e){}
go("home",false);
</script></body></html>
